<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>Delta — Founder Network</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --font-display:'Fraunces',Georgia,serif;
      --font-ui:'Manrope',system-ui,sans-serif;

      --bg:#05060A;
      --surface:rgba(255,255,255,.055);
      --raised:rgba(255,255,255,.09);
      --border:rgba(255,255,255,.12);

      --ink:#F7F8FF;
      --muted:#9DA1B3;
      --soft:#6F7385;

      --gold:#E8C77A;
      --gold-2:#F4D99A;

      --purple:#9B6CFF;
      --purple-2:#C3A7FF;

      --danger:#FF6B81;
      --success:#65D8A4;

      --shadow:
        0 30px 80px rgba(0,0,0,.42),
        0 10px 30px rgba(0,0,0,.28);

      --radius:26px;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      min-height:100vh;
      background:var(--bg);
      color:var(--ink);
      font-family:var(--font-ui);
      overflow-x:hidden;
    }

    button,
    input,
    textarea,
    select{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    img{
      max-width:100%;
      display:block;
    }

    .hidden{
      display:none !important;
    }

    /* =========================
       BACKGROUND
    ========================= */

    .aurora{
      position:fixed;
      inset:-20%;
      pointer-events:none;
      z-index:-4;
      overflow:hidden;
      filter:blur(50px);
    }

    .aurora::before,
    .aurora::after{
      content:"";
      position:absolute;
      border-radius:50%;
      animation:floatAurora 16s ease-in-out infinite alternate;
    }

    .aurora::before{
      width:55vw;
      height:55vw;
      left:-10vw;
      top:-10vw;
      background:
        radial-gradient(circle,
          rgba(155,108,255,.20) 0%,
          rgba(155,108,255,.06) 35%,
          transparent 70%);
    }

    .aurora::after{
      width:60vw;
      height:60vw;
      right:-15vw;
      bottom:-20vw;
      background:
        radial-gradient(circle,
          rgba(232,199,122,.14) 0%,
          rgba(232,199,122,.04) 38%,
          transparent 70%);
      animation-delay:-6s;
    }

    @keyframes floatAurora{
      from{
        transform:translate3d(-2%,0,0) scale(1);
      }
      to{
        transform:translate3d(4%,5%,0) scale(1.12);
      }
    }

    .noise{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:-2;
      opacity:.035;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
    }

    .grid{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:-3;
      opacity:.18;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
      background-size:48px 48px;
      mask-image:linear-gradient(to bottom,black,transparent 80%);
    }

    .orb{
      position:fixed;
      width:180px;
      height:180px;
      border-radius:50%;
      pointer-events:none;
      opacity:.22;
      filter:blur(3px);
      border:1px solid rgba(255,255,255,.08);
      background:
        radial-gradient(
          circle at 35% 30%,
          rgba(255,255,255,.10),
          transparent 50%
        );
      animation:orbFloat 12s ease-in-out infinite;
      z-index:-1;
    }

    .orb.one{
      top:15%;
      left:-70px;
    }

    .orb.two{
      bottom:10%;
      right:-80px;
      animation-delay:-5s;
    }

    @keyframes orbFloat{
      0%,100%{
        transform:translateY(0) rotate(0deg);
      }
      50%{
        transform:translateY(-25px) rotate(12deg);
      }
    }

    /* =========================
       APP
    ========================= */

    #app{
      min-height:100vh;
    }

    .screen{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
    }

    /* =========================
       AUTH
    ========================= */

    .auth-wrap{
      width:min(460px,100%);
    }

    .brand-lockup{
      text-align:center;
      margin-bottom:30px;
    }

    .brand-mark{
      width:66px;
      height:66px;
      margin:0 auto 18px;
      display:grid;
      place-items:center;
      border-radius:22px;
      font-family:var(--font-display);
      font-size:28px;
      font-weight:700;
      color:#08090D;
      background:
        linear-gradient(
          145deg,
          var(--gold-2),
          var(--gold)
        );
      box-shadow:
        0 15px 45px rgba(232,199,122,.18),
        inset 0 1px 0 rgba(255,255,255,.65);
    }

    .brand-name{
      font-family:var(--font-display);
      font-size:42px;
      line-height:1;
      letter-spacing:-.035em;
    }

    .brand-subtitle{
      margin-top:10px;
      color:var(--muted);
      font-size:14px;
      line-height:1.6;
    }

    .auth-card{
      position:relative;
      padding:30px;
      border-radius:32px;
      border:1px solid var(--border);
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.085),
          rgba(255,255,255,.035)
        );
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .auth-card::before{
      content:"";
      position:absolute;
      width:220px;
      height:220px;
      top:-130px;
      right:-90px;
      border-radius:50%;
      background:rgba(155,108,255,.16);
      filter:blur(45px);
      pointer-events:none;
    }

    .auth-card h1{
      position:relative;
      font-family:var(--font-display);
      font-size:32px;
      line-height:1.08;
      letter-spacing:-.025em;
      margin-bottom:9px;
    }

    .auth-card .intro{
      position:relative;
      color:var(--muted);
      font-size:14px;
      line-height:1.65;
      margin-bottom:25px;
    }

    .field{
      margin-bottom:17px;
    }

    .field label{
      display:block;
      margin-bottom:8px;
      font-size:12px;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
      color:#C7CAD7;
    }

    .input{
      width:100%;
      min-height:54px;
      border:1px solid rgba(255,255,255,.11);
      border-radius:16px;
      outline:none;
      color:var(--ink);
      background:rgba(0,0,0,.22);
      padding:0 16px;
      transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
    }

    textarea.input{
      min-height:130px;
      padding:15px;
      resize:vertical;
    }

    .input::placeholder{
      color:#686D7C;
    }

    .input:focus{
      border-color:rgba(232,199,122,.55);
      background:rgba(0,0,0,.30);
      box-shadow:
        0 0 0 4px rgba(232,199,122,.08);
    }

    .primary-btn{
      width:100%;
      min-height:55px;
      border:0;
      border-radius:17px;
      padding:0 20px;
      color:#090A0D;
      font-weight:800;
      background:
        linear-gradient(
          135deg,
          var(--gold-2),
          var(--gold)
        );
      box-shadow:
        0 15px 35px rgba(232,199,122,.14),
        inset 0 1px 0 rgba(255,255,255,.65);
      transition:
        transform .18s ease,
        box-shadow .18s ease;
    }

    .primary-btn:hover{
      transform:translateY(-2px);
      box-shadow:
        0 20px 45px rgba(232,199,122,.20),
        inset 0 1px 0 rgba(255,255,255,.65);
    }

    .primary-btn:active{
      transform:translateY(0);
    }

    .primary-btn:disabled{
      opacity:.55;
      cursor:not-allowed;
      transform:none;
    }

    .auth-note{
      margin-top:18px;
      color:var(--soft);
      font-size:11px;
      line-height:1.6;
      text-align:center;
    }

    /* =========================
       NAVBAR
    ========================= */

    .navbar{
      position:sticky;
      top:0;
      z-index:50;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      height:76px;
      padding:0 24px;
      border-bottom:1px solid rgba(255,255,255,.08);
      background:rgba(5,6,10,.70);
      backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px);
    }

    .nav-brand{
      display:flex;
      align-items:center;
      gap:11px;
      min-width:0;
    }

    .nav-brand-mark{
      width:38px;
      height:38px;
      flex:none;
      display:grid;
      place-items:center;
      border-radius:12px;
      background:linear-gradient(145deg,var(--gold-2),var(--gold));
      color:#08090D;
      font-family:var(--font-display);
      font-weight:700;
    }

    .nav-brand-text{
      font-family:var(--font-display);
      font-size:23px;
    }

    .nav-actions{
      display:flex;
      align-items:center;
      gap:9px;
    }

    .icon-btn{
      width:42px;
      height:42px;
      display:grid;
      place-items:center;
      border-radius:13px;
      border:1px solid rgba(255,255,255,.09);
      background:rgba(255,255,255,.045);
      color:var(--ink);
      transition:.2s ease;
    }

    .icon-btn:hover{
      background:rgba(255,255,255,.09);
      border-color:rgba(255,255,255,.16);
    }

    /* =========================
       MAIN
    ========================= */

    .main{
      width:min(1160px,100%);
      margin:0 auto;
      padding:35px 20px 120px;
    }

    .hero{
      display:grid;
      grid-template-columns:1.3fr .7fr;
      gap:22px;
      margin-bottom:28px;
    }

    .hero-card,
    .card{
      position:relative;
      border:1px solid var(--border);
      background:var(--surface);
      border-radius:var(--radius);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      box-shadow:0 18px 60px rgba(0,0,0,.18);
    }

    .hero-card{
      padding:35px;
      overflow:hidden;
    }

    .hero-card::after{
      content:"";
      position:absolute;
      width:300px;
      height:300px;
      right:-150px;
      top:-170px;
      border-radius:50%;
      background:rgba(155,108,255,.14);
      filter:blur(45px);
    }

    .eyebrow{
      position:relative;
      z-index:1;
      color:var(--gold);
      text-transform:uppercase;
      letter-spacing:.13em;
      font-size:10px;
      font-weight:800;
      margin-bottom:12px;
    }

    .hero h1{
      position:relative;
      z-index:1;
      font-family:var(--font-display);
      font-size:clamp(38px,5vw,64px);
      line-height:.98;
      letter-spacing:-.045em;
      max-width:700px;
    }

    .hero p{
      position:relative;
      z-index:1;
      color:var(--muted);
      line-height:1.7;
      font-size:14px;
      max-width:650px;
      margin-top:18px;
    }

    .stat-card{
      padding:25px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .stat-label{
      color:var(--muted);
      font-size:12px;
      margin-bottom:8px;
    }

    .stat-value{
      font-family:var(--font-display);
      font-size:42px;
      color:var(--gold-2);
    }

    /* =========================
       TABS
    ========================= */

    .tabs{
      position:fixed;
      z-index:100;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
      display:flex;
      align-items:center;
      gap:4px;
      padding:7px;
      border:1px solid rgba(255,255,255,.11);
      border-radius:22px;
      background:rgba(10,11,16,.80);
      backdrop-filter:blur(25px);
      -webkit-backdrop-filter:blur(25px);
      box-shadow:
        0 20px 55px rgba(0,0,0,.45);
    }

    .tab{
      border:0;
      min-width:75px;
      padding:10px 12px;
      border-radius:16px;
      background:transparent;
      color:#85899A;
      font-size:11px;
      font-weight:700;
      transition:.2s ease;
    }

    .tab:hover{
      color:var(--ink);
    }

    .tab.active{
      color:#0A0B0E;
      background:linear-gradient(
        135deg,
        var(--gold-2),
        var(--gold)
      );
    }

    /* =========================
       CONTENT
    ========================= */

    .section-head{
      display:flex;
      align-items:end;
      justify-content:space-between;
      gap:15px;
      margin-bottom:17px;
    }

    .section-head h2{
      font-family:var(--font-display);
      font-size:30px;
      letter-spacing:-.03em;
    }

    .section-head p{
      color:var(--muted);
      font-size:12px;
      margin-top:5px;
    }

    .feed{
      display:grid;
      gap:16px;
    }

    .post{
      padding:22px;
    }

    .post-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:17px;
    }

    .user-mini{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .avatar{
      width:42px;
      height:42px;
      flex:none;
      display:grid;
      place-items:center;
      overflow:hidden;
      border-radius:14px;
      background:
        linear-gradient(
          145deg,
          rgba(232,199,122,.30),
          rgba(155,108,255,.28)
        );
      border:1px solid rgba(255,255,255,.10);
      font-size:12px;
      font-weight:800;
    }

    .avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .user-name{
      font-weight:800;
      font-size:13px;
    }

    .post-time{
      color:var(--soft);
      font-size:10px;
      margin-top:3px;
    }

    .post-text{
      color:#D8DAE3;
      line-height:1.7;
      font-size:14px;
      white-space:pre-wrap;
    }

    .post-image{
      margin-top:17px;
      border-radius:18px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.08);
    }

    .post-image img{
      width:100%;
      max-height:500px;
      object-fit:cover;
    }

    .post-actions{
      display:flex;
      gap:8px;
      margin-top:18px;
    }

    .small-btn{
      min-height:36px;
      border:1px solid rgba(255,255,255,.09);
      background:rgba(255,255,255,.04);
      color:#BFC2CF;
      border-radius:12px;
      padding:0 13px;
      font-size:11px;
      font-weight:700;
    }

    .small-btn:hover{
      background:rgba(255,255,255,.08);
      color:var(--ink);
    }

    .small-btn.danger:hover{
      color:var(--danger);
    }

    .empty{
      padding:50px 25px;
      text-align:center;
      color:var(--muted);
      border:1px dashed rgba(255,255,255,.12);
      border-radius:22px;
    }

    .empty strong{
      display:block;
      color:var(--ink);
      margin-bottom:7px;
      font-size:15px;
    }

    /* =========================
       DISCOVER
    ========================= */

    .search-box{
      margin-bottom:18px;
    }

    .founder-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:16px;
    }

    .founder-card{
      padding:21px;
    }

    .founder-top{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:15px;
    }

    .founder-card h3{
      font-size:15px;
    }

    .founder-card p{
      color:var(--muted);
      font-size:12px;
      line-height:1.6;
    }

    .tag-row{
      display:flex;
      flex-wrap:wrap;
      gap:7px;
      margin-top:15px;
    }

    .tag{
      padding:6px 9px;
      border-radius:999px;
      background:rgba(155,108,255,.09);
      border:1px solid rgba(155,108,255,.16);
      color:#C8B4FF;
      font-size:10px;
      font-weight:700;
    }

    /* =========================
       PROFILE
    ========================= */

    .profile-card{
      padding:30px;
    }

    .profile-hero{
      display:flex;
      align-items:center;
      gap:17px;
      margin-bottom:25px;
    }

    .profile-avatar{
      width:75px;
      height:75px;
      border-radius:23px;
      font-size:20px;
    }

    .profile-hero h1{
      font-family:var(--font-display);
      font-size:34px;
    }

    .profile-hero p{
      color:var(--muted);
      font-size:12px;
      margin-top:5px;
    }

    .profile-stats{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      margin-bottom:25px;
    }

    .profile-stat{
      padding:17px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.035);
      border-radius:16px;
      text-align:center;
    }

    .profile-stat strong{
      display:block;
      font-family:var(--font-display);
      font-size:25px;
    }

    .profile-stat span{
      display:block;
      color:var(--muted);
      font-size:10px;
      margin-top:4px;
    }

    .profile-bio{
      color:#C9CBD5;
      line-height:1.7;
      font-size:13px;
      margin-bottom:20px;
    }

    /* =========================
       MODALS
    ========================= */

    .modal{
      position:fixed;
      inset:0;
      z-index:200;
      display:grid;
      place-items:center;
      padding:20px;
      background:rgba(0,0,0,.65);
      backdrop-filter:blur(12px);
    }

    .modal-card{
      width:min(560px,100%);
      max-height:90vh;
      overflow:auto;
      padding:27px;
      border-radius:27px;
      border:1px solid var(--border);
      background:#0B0C11;
      box-shadow:0 30px 100px rgba(0,0,0,.6);
    }

    .modal-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:22px;
    }

    .modal-head h2{
      font-family:var(--font-display);
      font-size:28px;
    }

    /* =========================
       TOAST
    ========================= */

    #toast{
      position:fixed;
      z-index:500;
      left:50%;
      top:25px;
      transform:translate(-50%,-15px);
      opacity:0;
      pointer-events:none;
      max-width:min(90vw,420px);
      padding:13px 17px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(15,16,22,.92);
      color:var(--ink);
      box-shadow:0 15px 45px rgba(0,0,0,.35);
      font-size:12px;
      transition:.25s ease;
    }

    #toast.show{
      opacity:1;
      transform:translate(-50%,0);
    }

    /* =========================
       LIGHT THEME
    ========================= */

    [data-theme="light"]{
      --bg:#F4F2EE;
      --surface:rgba(255,255,255,.70);
      --raised:rgba(255,255,255,.85);
      --border:rgba(20,20,25,.10);
      --ink:#17171B;
      --muted:#666873;
      --soft:#858691;
    }

    [data-theme="light"] .navbar{
      background:rgba(244,242,238,.78);
    }

    [data-theme="light"] .tabs{
      background:rgba(255,255,255,.85);
    }

    [data-theme="light"] .input{
      background:rgba(255,255,255,.65);
      color:var(--ink);
      border-color:rgba(20,20,25,.10);
    }

    [data-theme="light"] .post-text{
      color:#33343B;
    }

    [data-theme="light"] .modal-card{
      background:#fff;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media(max-width:850px){
      .hero{
        grid-template-columns:1fr;
      }

      .founder-grid{
        grid-template-columns:repeat(2,1fr);
      }
    }

    @media(max-width:620px){
      .screen{
        padding:18px;
      }

      .auth-card{
        padding:23px;
        border-radius:25px;
      }

      .brand-name{
        font-size:37px;
      }

      .navbar{
        height:68px;
        padding:0 15px;
      }

      .nav-brand-text{
        font-size:20px;
      }

      .main{
        padding:25px 14px 110px;
      }

      .hero-card{
        padding:25px;
      }

      .hero h1{
        font-size:42px;
      }

      .founder-grid{
        grid-template-columns:1fr;
      }

      .tabs{
        width:calc(100% - 20px);
        justify-content:space-between;
      }

      .tab{
        min-width:0;
        flex:1;
        padding:10px 5px;
        font-size:9px;
      }

      .profile-stats{

    const $ = id => document.getElementById(id);

    function esc(value){
      if(value === null || value === undefined) return "";

      return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
    }


    function ago(date){
      if(!date) return "";

      const diff =
        Math.floor(
          (Date.now() - new Date(date).getTime()) / 1000
        );

      if(diff < 60) return "just now";

      const mins = Math.floor(diff / 60);

      if(mins < 60){
        return mins + "m ago";
      }

      const hours = Math.floor(mins / 60);

      if(hours < 24){
        return hours + "h ago";
      }

      const days = Math.floor(hours / 24);

      if(days < 30){
        return days + "d ago";
      }

      return new Date(date).toLocaleDateString();
    }


    function initials(name){
      if(!name) return "?";

      return name
        .trim()
        .split(/\s+/)
        .slice(0,2)
        .map(x => x[0])
        .join("")
        .toUpperCase();
    }

      return `

          ${esc(initials(user.full_name || user.name))}
        </div>

    /*
      IMPORTANT:

      Supabase's password authentication requires an email
      or phone identity.

      We therefore create a hidden internal email.
      The user never sees or enters it.
    */

    async function createAccount(event){

      event.preventDefault();

      const name =
        $("founderName")
          .value
          .trim();

      const password =
        $("founderPassword")
          .value;

      const button =
        $("createAccountBtn");


      if(!name){
        toast("Please enter your name.");
        return;
      }


      if(password.length < 6){
        toast("Password must be at least 6 characters.");
        return;
      }


      button.disabled = true;
      button.textContent = "Creating your account…";


      try{

        /*
          Generate an internal email address.

          The user never sees this address.
        */

        const internalEmail =
          `founder-${crypto.randomUUID()}@delta.internal`;


        const {
          data,
          error
        } =
          await db.auth.signUp({
            email:internalEmail,
            password:password,

            options:{
              data:{
                full_name:name,
                founder_name:name
              }
            }
          });


        if(error){
          throw error;
        }


        if(!data.user){
          throw new Error(
            "Account could not be created."
          );
        }


        /*
          If Supabase email confirmation is enabled,
          there will be no active session.

          For this name/password-only MVP,
          email confirmation must be disabled.
        */

        if(!data.session){

          throw new Error(
            "Account created, but Supabase requires email confirmation. Turn OFF 'Confirm email' in Supabase Authentication settings."
          );
        }


        me = data.user;


        /*
          Create the founder profile.
        */

        const {
          data:existingProfile,
          error:profileError
        } =
          await db
            .from("profiles")
            .select("*")
            .eq("id",me.id)
            .maybeSingle();


        if(profileError){
          console.warn(
            "Profile lookup error:",
            profileError
          );
        }


        if(existingProfile){

          profile = existingProfile;

        }else{

          const {
            data:newProfile,

          } =
            await db
              .from("profiles")

                id:me.id,

          if(newProfileError){
            console.warn(
              "Profile creation error:",
              newProfileError
            );

            profile = {
              id:me.id,
              full_name:name
            };

          }else{

            profile = newProfile;

        toast(
          `Welcome to Delta, ${name.split(" ")[0]}.`

        /*

        toast(
          error?.message ||
          "Unable to create your account."
        );

      }finally{

        button.disabled = false;
        button.textContent =
          "Create my founder account";

      }
    }

    /* =========================================================
       SIGN OUT
    ========================================================= */

    async function signOut(){

      try{

        await db.auth.signOut();

      }catch(error){

        console.error(error);

      }finally{

        me = null;
        profile = null;

        tab = "feed";

        showAuth();
      }
    }


    /* =========================================================
       AUTH STATE
    ========================================================= */

    db.auth.onAuthStateChange(
      async (event,session) => {

        /*
          No password-reset UI anymore.
          We only care about the active session.
        */

        if(session?.user){

          me = session.user;

        }else{

          me = null;
          profile = null;

        }
      }
    );


    /* =========================================================
       BOOT
    ========================================================= */

    async function boot(){

      try{

        const {
          data,
          error
        } =
          await db.auth.getSession();


        if(error){
          throw error;
        }


        const session =
          data?.session;


        if(!session){

          me = null;
          profile = null;

          showAuth();

          return;
        }


        me = session.user;


        await loadCurrentProfile();


        /*
          If the user has an account but no profile,
          send them through setup.
        */

        if(!profile){

          showProfileSetup();

          return;
        }


        showShell();


      }catch(error){

        console.error(
          "Boot error:",
          error
        );

        me = null;
        profile = null;

        showAuth();
      }
    }


    /* =========================================================
       GLOBAL ERROR PROTECTION
    ========================================================= */

    window.addEventListener(
      "unhandledrejection",
      event => {

        console.error(
          "Unhandled promise rejection:",
          event.reason
        );

      }
    );


    window.addEventListener(
      "error",
      event => {

        console.error(
          "Global error:",
          event.error
        );

      }
    );


    /* =========================================================
       START
    ========================================================= */

    boot();

  </script>
