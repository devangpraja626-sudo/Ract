<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ract — Founders, Ideas, Connections</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#070707;
    --bg2:#0c0c0f;
    --card:rgba(20,20,24,.78);
    --card2:rgba(25,25,30,.9);
    --border:rgba(255,255,255,.09);
    --border2:rgba(255,255,255,.14);

    --text:#f5f5f7;
    --muted:#92929b;

    --gold:#d9b86c;
    --gold2:#f0d98b;

    --purple:#8b5cf6;
    --purple2:#b18aff;

    --silver:#d9d9df;

    --danger:#ff5b73;

    --shadow:
        0 30px 100px rgba(0,0,0,.45);

    --radius:22px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:
        radial-gradient(circle at 15% 10%,rgba(139,92,246,.12),transparent 28%),
        radial-gradient(circle at 85% 15%,rgba(217,184,108,.10),transparent 25%),
        radial-gradient(circle at 50% 100%,rgba(139,92,246,.07),transparent 35%),
        var(--bg);

    color:var(--text);
    font-family:"DM Sans",sans-serif;
    min-height:100vh;
}

/* subtle grain */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.025;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    z-index:999;
}

/* NAV */

.nav{
    position:sticky;
    top:0;
    z-index:100;

    height:76px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 5vw;

    background:rgba(7,7,7,.72);
    backdrop-filter:blur(25px);

    border-bottom:1px solid var(--border);
}

.logo{
    font-family:"Space Grotesk",sans-serif;
    font-size:26px;
    font-weight:700;
    letter-spacing:-1px;

    background:linear-gradient(
        120deg,
        #fff,
        var(--silver),
        var(--gold2)
    );

    -webkit-background-clip:text;
    color:transparent;
}

.logo span{
    color:var(--purple2);
}

.nav-right{
    display:flex;
    gap:10px;
    align-items:center;
}

.icon-btn{
    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid var(--border);
    background:rgba(255,255,255,.04);

    color:#ddd;

    border-radius:13px;

    cursor:pointer;

    transition:.25s;
}

.icon-btn:hover{
    border-color:rgba(217,184,108,.4);
    transform:translateY(-2px);
}

/* LAYOUT */

.app{
    width:min(1180px,92%);
    margin:auto;

    display:grid;
    grid-template-columns:240px minmax(0,650px) 250px;

    gap:28px;

    padding:35px 0 80px;
}

/* SIDEBAR */

.sidebar{
    position:sticky;
    top:105px;
    height:max-content;
}

.nav-card{
    padding:14px;

    border:1px solid var(--border);

    background:rgba(16,16,19,.65);

    border-radius:22px;

    box-shadow:var(--shadow);
}

.nav-item{
    width:100%;

    display:flex;
    align-items:center;
    gap:13px;

    padding:13px 14px;

    border:0;
    background:none;

    color:#9999a2;

    border-radius:13px;

    font-family:inherit;
    font-size:14px;

    cursor:pointer;

    transition:.2s;
}

.nav-item:hover{
    background:rgba(255,255,255,.05);
    color:#fff;
}

.nav-item.active{
    background:
        linear-gradient(
            100deg,
            rgba(139,92,246,.17),
            rgba(217,184,108,.08)
        );

    color:#fff;

    border:1px solid rgba(139,92,246,.18);
}

.nav-icon{
    font-size:18px;
    width:23px;
}

/* MAIN */

.main{
    min-width:0;
}

/* HERO */

.hero{
    position:relative;
    overflow:hidden;

    padding:34px;

    border-radius:28px;

    border:1px solid var(--border);

    background:
        radial-gradient(
            circle at 80% 0%,
            rgba(139,92,246,.18),
            transparent 35%
        ),
        radial-gradient(
            circle at 20% 100%,
            rgba(217,184,108,.10),
            transparent 35%
        ),
        rgba(15,15,18,.85);

    box-shadow:var(--shadow);

    margin-bottom:22px;
}

.hero::after{
    content:"";

    position:absolute;

    width:180px;
    height:180px;

    right:-70px;
    top:-70px;

    border-radius:50%;

    border:1px solid rgba(217,184,108,.15);

    box-shadow:
        0 0 80px rgba(139,92,246,.12);
}

.eyebrow{
    color:var(--gold2);

    font-size:11px;
    font-weight:700;

    text-transform:uppercase;

    letter-spacing:2px;

    margin-bottom:12px;
}

.hero h1{
    font-family:"Space Grotesk",sans-serif;

    font-size:clamp(30px,5vw,48px);

    line-height:1.02;

    letter-spacing:-2px;

    max-width:550px;
}

.hero h1 span{
    background:
        linear-gradient(
            100deg,
            var(--gold2),
            #fff,
            var(--purple2)
        );

    -webkit-background-clip:text;

    color:transparent;
}

.hero p{
    margin-top:14px;

    color:var(--muted);

    max-width:510px;

    line-height:1.6;

    font-size:14px;
}

/* CREATE POST */

.composer{
    padding:18px;

    border:1px solid var(--border);

    background:var(--card);

    border-radius:22px;

    margin-bottom:20px;

    box-shadow:var(--shadow);
}

.composer-top{
    display:flex;
    gap:12px;
}

.avatar{
    width:44px;
    height:44px;

    border-radius:50%;

    object-fit:cover;

    border:1px solid rgba(217,184,108,.35);

    background:
        linear-gradient(
            135deg,
            rgba(139,92,246,.4),
            rgba(217,184,108,.2)
        );
}

.avatar.large{
    width:76px;
    height:76px;
}

.avatar.xlarge{
    width:92px;
    height:92px;
}

textarea{
    width:100%;

    min-height:90px;

    resize:vertical;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    font-family:inherit;

    font-size:15px;

    padding:10px 0;
}

textarea::placeholder{
    color:#6f6f77;
}

.composer-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;

    border-top:1px solid var(--border);

    padding-top:13px;

    margin-top:8px;
}

.upload-btn{
    color:#aaa;

    cursor:pointer;

    font-size:13px;

    display:flex;
    align-items:center;
    gap:7px;
}

.upload-btn:hover{
    color:var(--gold2);
}

input[type="file"]{
    display:none;
}

/* BUTTON */

.btn{
    border:1px solid rgba(217,184,108,.35);

    background:
        linear-gradient(
            135deg,
            rgba(217,184,108,.18),
            rgba(139,92,246,.15)
        );

    color:#fff;

    padding:10px 17px;

    border-radius:12px;

    cursor:pointer;

    font-family:inherit;

    font-weight:700;

    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);

    border-color:rgba(217,184,108,.65);

    box-shadow:
        0 10px 30px rgba(139,92,246,.15);
}

/* POSTS */

.feed{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.post{
    border:1px solid var(--border);

    background:var(--card);

    border-radius:22px;

    padding:20px;

    box-shadow:var(--shadow);

    transition:.25s;
}

.post:hover{
    border-color:rgba(255,255,255,.14);
}

.post-head{
    display:flex;
    align-items:center;
    gap:12px;
}

.post-author{
    flex:1;
}

.author-name{
    font-weight:700;
    font-size:14px;
}

.author-name span{
    color:var(--gold2);
}

.post-meta{
    color:#6f6f78;
    font-size:12px;
    margin-top:3px;
}

.post-content{
    margin-top:16px;

    line-height:1.65;

    color:#ddd;

    white-space:pre-wrap;
}

.post-image{
    width:100%;

    max-height:600px;

    object-fit:cover;

    border-radius:16px;

    margin-top:15px;

    border:1px solid var(--border);
}

.post-actions{
    display:flex;

    gap:5px;

    margin-top:16px;

    border-top:1px solid var(--border);

    padding-top:12px;
}

.action{
    border:0;

    background:transparent;

    color:#777;

    padding:8px 11px;

    border-radius:10px;

    cursor:pointer;

    font-family:inherit;

    display:flex;
    align-items:center;
    gap:7px;
}

.action:hover{
    color:#fff;
    background:rgba(255,255,255,.04);
}

.action.liked{
    color:#ff6681;
}

/* RIGHT SIDE */

.right{
    position:sticky;
    top:105px;
    height:max-content;

    display:flex;
    flex-direction:column;
    gap:16px;
}

.side-card{
    border:1px solid var(--border);

    background:rgba(15,15,18,.75);

    border-radius:20px;

    padding:18px;
}

.side-title{
    font-family:"Space Grotesk",sans-serif;

    font-size:14px;

    margin-bottom:15px;
}

.founder-mini{
    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:15px;
}

.founder-mini:last-child{
    margin-bottom:0;
}

.founder-info{
    flex:1;

    min-width:0;
}

.founder-info strong{
    display:block;

    font-size:13px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.founder-info span{
    display:block;

    color:#777;

    font-size:11px;

    margin-top:2px;
}

.follow{
    background:transparent;

    color:var(--gold2);

    border:1px solid rgba(217,184,108,.3);

    padding:6px 9px;

    border-radius:8px;

    font-size:11px;

    cursor:pointer;
}

/* PROFILE */

.profile-page{
    display:none;
}

.profile-cover{
    height:160px;

    border-radius:24px 24px 0 0;

    background:
        radial-gradient(
            circle at 20% 30%,
            rgba(139,92,246,.35),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 40%,
            rgba(217,184,108,.25),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #15131c,
            #0a0a0c
        );

    border:1px solid var(--border);

    position:relative;
}

.profile-info{
    background:var(--card);

    border:1px solid var(--border);

    border-top:0;

    border-radius:0 0 24px 24px;

    padding:0 25px 25px;
}

.profile-avatar-wrap{
    transform:translateY(-45px);

    margin-bottom:-32px;
}

.profile-name{
    font-family:"Space Grotesk",sans-serif;

    font-size:27px;

    margin-top:15px;
}

.profile-handle{
    color:var(--gold2);

    font-size:13px;

    margin-top:4px;
}

.profile-bio{
    color:#aaa;

    line-height:1.6;

    margin-top:14px;

    font-size:14px;
}

.profile-stats{
    display:flex;

    gap:30px;

    margin-top:20px;

    padding-top:18px;

    border-top:1px solid var(--border);
}

.stat strong{
    display:block;

    font-size:17px;
}

.stat span{
    color:#777;

    font-size:11px;
}

/* MODAL */

.modal{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.75);

    backdrop-filter:blur(12px);

    display:none;

    align-items:center;

    justify-content:center;

    z-index:500;

    padding:20px;
}

.modal.open{
    display:flex;
}

.modal-box{
    width:min(500px,100%);

    max-height:90vh;

    overflow:auto;

    background:#111115;

    border:1px solid var(--border2);

    border-radius:25px;

    padding:25px;

    box-shadow:0 40px 120px rgba(0,0,0,.7);
}

.modal-head{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:22px;
}

.modal-head h2{
    font-family:"Space Grotesk",sans-serif;
}

.close{
    border:0;

    background:rgba(255,255,255,.06);

    color:#aaa;

    width:35px;
    height:35px;

    border-radius:10px;

    cursor:pointer;
}

.field{
    width:100%;

    background:#09090c;

    border:1px solid var(--border);

    border-radius:12px;

    padding:12px 14px;

    color:#fff;

    outline:none;

    font-family:inherit;

    margin-bottom:13px;
}

.field:focus{
    border-color:rgba(139,92,246,.5);
}

label{
    display:block;

    font-size:12px;

    color:#999;

    margin-bottom:7px;
}

/* COMMENTS */

.comments{
    margin-top:10px;

    padding-top:10px;

    border-top:1px solid var(--border);
}

.comment{
    display:flex;

    gap:9px;

    margin-top:12px;
}

.comment-body{
    background:rgba(255,255,255,.04);

    padding:9px 11px;

    border-radius:12px;

    font-size:12px;

    flex:1;
}

.comment-body strong{
    display:block;

    margin-bottom:3px;
}

.comment-form{
    display:flex;

    gap:8px;

    margin-top:12px;
}

.comment-form input{
    flex:1;

    background:#09090c;

    border:1px solid var(--border);

    color:#fff;

    padding:9px 11px;

    border-radius:10px;

    outline:none;
}

/* DISCOVER */

.page-title{
    font-family:"Space Grotesk",sans-serif;

    font-size:30px;

    margin-bottom:7px;
}

.page-sub{
    color:#777;

    font-size:13px;

    margin-bottom:20px;
}

.search{
    width:100%;

    padding:14px 16px;

    border:1px solid var(--border);

    border-radius:15px;

    background:var(--card);

    color:#fff;

    outline:none;

    margin-bottom:17px;

    font-family:inherit;
}

.founders-grid{
    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:14px;
}

.founder-card{
    border:1px solid var(--border);

    background:var(--card);

    border-radius:20px;

    padding:20px;

    transition:.25s;
}

.founder-card:hover{
    transform:translateY(-3px);

    border-color:rgba(217,184,108,.3);
}

.founder-card .avatar{
    margin-bottom:13px;
}

.founder-card h3{
    font-family:"Space Grotesk",sans-serif;

    font-size:17px;
}

.founder-card .company{
    color:var(--gold2);

    font-size:12px;

    margin-top:4px;
}

.founder-card p{
    color:#888;

    font-size:12px;

    line-height:1.5;

    margin-top:10px;

    min-height:38px;
}

.tags{
    display:flex;

    flex-wrap:wrap;

    gap:5px;

    margin-top:12px;
}

.tag{
    background:rgba(139,92,246,.1);

    border:1px solid rgba(139,92,246,.15);

    color:#b99cff;

    padding:4px 7px;

    border-radius:7px;

    font-size:10px;
}

.empty{
    text-align:center;

    padding:50px 20px;

    color:#666;

    border:1px dashed var(--border);

    border-radius:20px;
}

/* TOAST */

.toast{
    position:fixed;

    bottom:25px;
    left:50%;

    transform:translateX(-50%);

    background:#17171b;

    border:1px solid rgba(217,184,108,.3);

    padding:12px 18px;

    border-radius:12px;

    color:#eee;

    z-index:1000;

    box-shadow:0 20px 50px rgba(0,0,0,.5);

    font-size:13px;
}

/* MOBILE */

.mobile-nav{
    display:none;
}

@media(max-width:1000px){

    .app{
        grid-template-columns:190px minmax(0,1fr);
    }

    .right{
        display:none;
    }
}

@media(max-width:720px){

    .nav{
        height:65px;

        padding:0 18px;
    }

    .app{
        display:block;

        width:94%;

        padding-top:20px;

        padding-bottom:100px;
    }

    .sidebar{
        display:none;
    }

    .hero{
        padding:25px;
    }

    .hero h1{
        font-size:34px;
    }

    .founders-grid{
        grid-template-columns:1fr;
    }

    .mobile-nav{
        position:fixed;

        display:flex;

        bottom:12px;

        left:12px;
        right:12px;

        height:65px;

        background:rgba(15,15,18,.92);

        backdrop-filter:blur(20px);

        border:1px solid var(--border);

        border-radius:20px;

        z-index:200;

        justify-content:space-around;

        align-items:center;

        box-shadow:0 20px 60px rgba(0,0,0,.6);
    }

    .mobile-nav button{
        background:none;

        border:0;

        color:#777;

        font-family:inherit;

        font-size:10px;

        display:flex;

        flex-direction:column;

        align-items:center;

        gap:4px;

        cursor:pointer;
    }

    .mobile-nav button.active{
        color:var(--gold2);
    }

    .post{
        padding:16px;
    }
}

</style>
</head>

<body>

<!-- NAVIGATION -->

<header class="nav">

    <div class="logo">
        r<span>a</span>ct
    </div>

    <div class="nav-right">

        <button class="icon-btn" onclick="openProfileEditor()">
            ✦
        </button>

    </div>

</header>


<div class="app">

    <!-- LEFT -->

    <aside class="sidebar">

        <div class="nav-card">

            <button class="nav-item active" data-page="home">
                <span class="nav-icon">⌂</span>
                Home
            </button>

            <button class="nav-item" data-page="discover">
                <span class="nav-icon">◈</span>
                Discover
            </button>

            <button class="nav-item" data-page="profile">
                <span class="nav-icon">◎</span>
                My Profile
            </button>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main" id="main"></main>


    <!-- RIGHT -->

    <aside class="right" id="rightSide"></aside>

</div>


<!-- MOBILE -->

<nav class="mobile-nav">

    <button class="active" data-page="home">
        <span>⌂</span>
        Home
    </button>

    <button data-page="discover">
        <span>◈</span>
        Discover
    </button>

    <button data-page="profile">
        <span>◎</span>
        Profile
    </button>

</nav>


<!-- PROFILE MODAL -->

<div class="modal" id="profileModal">

    <div class="modal-box">

        <div class="modal-head">

            <h2>Your founder profile</h2>

            <button class="close" onclick="closeModal('profileModal')">
                ×
            </button>

        </div>

        <form id="profileForm">

            <label>Profile picture</label>

            <input
                class="field"
                type="file"
                id="profilePhoto"
                accept="image/*"
                style="display:block"
            >

            <label>Your name</label>

            <input
                class="field"
                id="profileName"
                placeholder="Your name"
                required
            >

            <label>Startup / Company</label>

            <input
                class="field"
                id="profileCompany"
                placeholder="Your startup"
            >

            <label>What are you building?</label>

            <textarea
                class="field"
                id="profileBio"
                placeholder="Tell founders what you're building..."
                style="min-height:110px"
            ></textarea>

            <label>Industry</label>

            <input
                class="field"
                id="profileIndustry"
                placeholder="AI, SaaS, Fintech..."
            >

            <button class="btn" style="width:100%">
                Save profile
            </button>

        </form>

    </div>

</div>


<script>

const STORAGE_KEY = "ract_founder_network_v1";


let state = JSON.parse(
    localStorage.getItem(STORAGE_KEY)
) || {

    currentUser:"me",

    users:{

            id:"me",

        },

        arjun:{

            name:"Arjun Mehta",
            company:"Finora",
            bio:"Making financial infrastructure accessible.",
            industry:"Fintech",
            photo:"",
            following:[]
        }
    },

    posts:[
        {
            id:Date.now()-3000,
            userId:"alex",
            text:"The most interesting startups don't start with perfect products. They start with a problem that refuses to disappear.",
            image:"",
            likes:[],
            comments:[
                {
                    userId:"sara",
                    text:"Absolutely agree."
                }
            ],
            createdAt:Date.now()-3600000
        },

        {
            id:Date.now()-2000,
            userId:"sara",
            text:"Working on a new way for small teams to collaborate without drowning in meetings.",
            image:"",
            likes:["me"],
            comments:[],
            createdAt:Date.now()-7200000
        }
    ]

};


function save(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
    );

}


/* ---------- HELPERS ---------- */

function currentUser(){

    return state.users[state.currentUser];

}


function escapeHTML(text){

    return String(text || "")
        .replace(/[&<>"']/g,function(c){

            return {
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"
            }[c];

        });

}


function timeAgo(time){

    const seconds =
        Math.floor(
            (Date.now()-time)/1000
        );

    if(seconds < 60)
        return "just now";

    if(seconds < 3600)
        return Math.floor(seconds/60)+"m";

    if(seconds < 86400)
        return Math.floor(seconds/3600)+"h";

    return Math.floor(seconds/86400)+"d";

}


function avatar(user,size=""){

    if(user.photo){

        return `
        <img
            class="avatar ${size}"
            src="${user.photo}"
            alt=""
        >
        `;

    }

    const letter =
        (user.name || "?")
        .charAt(0)
        .toUpperCase();

    return `
    <div class="avatar ${size}"
         style="
         display:flex;
         align-items:center;
         justify-content:center;
         font-weight:700;
         color:#fff;
         ">
        ${letter}
    </div>
    `;

}


function toast(message){

    const el =
        document.createElement("div");

    el.className="toast";

    el.textContent=message;

    document.body.appendChild(el);

    setTimeout(
        ()=>el.remove(),
        2600
    );

}


/* ---------- NAVIGATION ---------- */

document
.querySelectorAll("[data-page]")
.forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{

            const page =
                button.dataset.page;

            navigate(page);

        }
    );

});


function navigate(page){

    document
    .querySelectorAll("[data-page]")
    .forEach(button=>{

        button.classList.toggle(
            "active",
            button.dataset.page===page
        );

    });

    if(page==="home")
        renderHome();

    if(page==="discover")
        renderDiscover();

    if(page==="profile")
        renderProfile();

}


/* ---------- HOME ---------- */

function renderHome(){

    document.getElementById("main").innerHTML=`

            </div>

            <h1>
                Ideas become
                <span>companies.</span>
            </h1>

            <p>

                building, discover new ideas and find the
                people who can help you create them.
            </p>

        </section>


        <section class="composer">

            <div class="composer-top">

            </div>

            <div class="composer-bottom">

function renderFeed(){

    const feed =
        document.getElementById("feed");

    if(!feed) return;


    const posts =
        [...state.posts]
        .sort(
            (a,b)=>
                b.createdAt-a.createdAt
        );


    if(!posts.length){

        feed.innerHTML=`
            <div class="empty">
                No ideas yet.
                Be the first founder to post.
            </div>
        `;

        return;

    }


    feed.innerHTML =
        posts.map(

}


/* ---------- POST ---------- */

function renderPost(post){

    const user =
        state.users[post.userId];

    if(!user) return "";


    const liked =
        post.likes.includes(
            state.currentUser
        );


    return `

    <article
        class="post"
        id="post-${post.id}"
    >

        <div class="post-head">

            ${avatar(user)}

            <div class="post-author">

                <div class="author-name">

                    ${escapeHTML(user.name)}

                    <span>✦</span>

                </div>

                <div class="post-meta">

                    ${escapeHTML(
                        user.company ||
                        "Founder"
                    )}

                    ·

                    ${timeAgo(
                        post.createdAt
                    )}

                </div>

            </div>

        </div>


        ${
            post.text
            ?
            `<div class="post-content">
                ${escapeHTML(post.text)}
            </div>`
            :
            ""
        }


        ${
            post.image
            ?
            `<img
                class="post-image"
                src="${post.image}"
                alt="Founder post"
            >`
            :
            ""
        }


        <div class="post-actions">

            <button
                class="action ${liked ? "liked":""}"
                onclick="toggleLike(${post.id})"
            >
                ${liked ? "♥":"♡"}
                ${post.likes.length}
            </button>


            <button
                class="action"
                onclick="toggleComments(${post.id})"
            >
                ◌
                ${post.comments.length}
            </button>


            <button
                class="action"
                onclick="openFounder('${user.id}')"
            >
                ↗ View founder
            </button>

        </div>


        <div
            class="comments"
            id="comments-${post.id}"
            style="display:none"
        >

            ${
                post.comments
                .map(comment=>{

                    const author =
                        state.users[
                            comment.userId
                        ];

                    return `

                    <div class="comment">

                        ${avatar(author)}

                        <div class="comment-body">

                            <strong>
                                ${escapeHTML(
                                    author?.name ||
                                    "Founder"
                                )}
                            </strong>

                            ${escapeHTML(
                                comment.text
                            )}

                        </div>

                    </div>

                    `;

                })
                .join("")
            }


            <form
                class="comment-form"
                onsubmit="addComment(event,${post.id})"
            >

                <input
                    name="comment"
                    placeholder="Add a thought..."
                    required
                >

                <button class="btn">
                    Send
                </button>

            </form>

        </div>

    </article>

    `;

}


let selectedPostImage="";


function previewPostImage(event){

    const file =
        event.target.files[0];

    if(!file) return;


    const reader =
        new FileReader();


    reader.onload=function(e){

        selectedPostImage =
            e.target.result;


        document.getElementById(
            "imagePreview"
        ).innerHTML=`

            <img
                class="post-image"
                src="${selectedPostImage}"
                style="max-height:250px"
            >

        `;

    };


    reader.readAsDataURL(file);

}


function createPost(){

    const text =
        document
        .getElementById("postText")
        .value
        .trim();


    if(!text && !selectedPostImage){

        toast(
            "Write something or add an image."
        );

        return;

    }


    state.posts.push({

        id:Date.now(),

        userId:state.currentUser,

        text,

        image:selectedPostImage,

        likes:[],

        comments:[],

        createdAt:Date.now()

    });


    save();

    selectedPostImage="";

    renderHome();

    toast("Idea published.");

}


function toggleLike(id){

    const post =
        state.posts.find(
            p=>p.id===id
        );

    if(!post) return;


    const index =
        post.likes.indexOf(
            state.currentUser
        );


    if(index>=0)
        post.likes.splice(index,1);

    else
        post.likes.push(
            state.currentUser
        );


    save();

    renderFeed();

}


function toggleComments(id){

    const el =
        document.getElementById(
            "comments-"+id
        );

    if(!el) return;

    el.style.display =
        el.style.display==="none"
        ?
        "block"
        :
        "none";

}


function addComment(event,id){

    event.preventDefault();


    const post =
        state.posts.find(
            p=>p.id===id
        );

    const text =
        event.target.comment
        .value
        .trim();


    if(!text) return;


    post.comments.push({

        userId:state.currentUser,

        text

    });


    save();

    renderFeed();

    setTimeout(
        ()=>toggleComments(id),
        20
    );

}

function toggleFollow(id){

    const me =
        currentUser();


    const index =

    if(index>=0)
        me.following.splice(index,1);

    else
        me.following.push(id);

    renderHome();

}


/* ---------- DISCOVER ---------- */

function renderDiscover(){

    document.getElementById("main").innerHTML=`

        <div class="page-title">
            Discover founders
        </div>

        <div class="page-sub">
            Find people building interesting things.
        </div>

        <input
            class="search"
            id="founderSearch"
            placeholder="Search founders, startups or industries..."
        >

            class="founders-grid"
            id="foundersGrid"
        ></div>

    document
    .getElementById(
        "founderSearch"
    )
    .addEventListener(
        "input",
        renderFounderCards
    );


    renderFounderCards();

    renderRightSide();

}


function renderFounderCards(){

    const query =
        (
            document
            .getElementById(
                "founderSearch"
            )
            .value || ""
        )
        .toLowerCase();


    const users =
        Object.values(state.users)
        .filter(user=>{

            if(user.id===state.currentUser)
                return false;


            return (

                user.name+
                " "+
                user.company+
                " "+
                user.industry+
                " "+
                user.bio

            )
            .toLowerCase()
            .includes(query);

        });


    const grid =
        document.getElementById(
            "foundersGrid"
        );


    if(!users.length){

        grid.innerHTML=`
            <div class="empty">
                No founders found.
            </div>
        `;

        return;

    }


    grid.innerHTML =
        users.map(user=>`

            <div class="founder-card">

                ${avatar(user,"large")}

                <h3>
                    ${escapeHTML(user.name)}
                </h3>

                <div class="company">
                    ${escapeHTML(
                        user.company ||
                        "Independent Founder"
                    )}
                </div>

                <p>
                    ${escapeHTML(
                        user.bio ||
                        "Building something new."
                    )}
                </p>

                <div class="tags">

                    ${
                        user.industry
                        ?
                        `<span class="tag">
                            ${escapeHTML(
                                user.industry
                            )}
                        </span>`
                        :
                        ""
                    }

                </div>

                <button
                    class="btn"
                    style="margin-top:16px;width:100%"
                    onclick="openFounder('${user.id}')"
                >
                    View founder
                </button>

            </div>

        `)
        .join("");

}

/* ---------- PROFILE EDITOR ---------- */

function openProfileEditor(){

    const user =
        currentUser();


    document.getElementById(
        "profileName"
    ).value =
        user.name || "";


    document.getElementById(
        "profileCompany"
    ).value =
        user.company || "";


    document.getElementById(
        "profileBio"
    ).value =
        user.bio || "";


    document.getElementById(
        "profileIndustry"
    ).value =
        user.industry || "";


    document
    .getElementById(
        "profileModal"
    )
    .classList.add("open");

}


function closeModal(id){

    document
    .getElementById(id)
    .classList.remove("open");

}


document
.getElementById("profileForm")
.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        const user =
            currentUser();


        user.name =
            document
            .getElementById(
                "profileName"
            )
            .value
            .trim()
            ||
            "Founder";


        user.company =
            document
            .getElementById(
                "profileCompany"
            )
            .value
            .trim();


        user.bio =
            document
            .getElementById(
                "profileBio"
            )
            .value
            .trim();


        user.industry =
            document
            .getElementById(
                "profileIndustry"
            )
            .value
            .trim();


        const file =
            document
            .getElementById(
                "profilePhoto"
            )
            .files[0];


        if(file){

            const reader =
                new FileReader();


            reader.onload=function(e){

                user.photo =
                    e.target.result;

                save();

                closeModal(
                    "profileModal"
                );

                navigate("profile");

                toast(
                    "Profile updated."
                );

            };


            reader.readAsDataURL(file);

        }else{

            save();

            closeModal(
                "profileModal"
            );

            navigate("profile");

            toast(
                "Profile updated."
            );

        }

    }
);
