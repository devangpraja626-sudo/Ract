function esc(value = "") {

  return String(value)

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}


function ago(date) {

  if (!date)
    return "";


  const sec =
    Math.floor(
      (
        Date.now() -
        new Date(date).getTime()
      ) / 1000
    );


  if (sec < 60)
    return "now";


  if (sec < 3600)
    return Math.floor(sec / 60) + "m";


  if (sec < 86400)
    return Math.floor(sec / 3600) + "h";


  if (sec < 604800)
    return Math.floor(sec / 86400) + "d";


  return new Date(date)
    .toLocaleDateString();

}


function initials(name = "Founder") {

  const parts =
    name
      .trim()
      .split(/\s+/)
      .filter(Boolean);


  if (!parts.length)
    return "F";


  return parts
    .map(x => x[0])
    .slice(0, 2)
    .join("")
    .toUpperCase();

}


function avatar(p, size = "") {

  return `

}


function toast(message, type = "") {

  const old =
    document.querySelector(".toast");


  if (old)
    old.remove();


  const t =
    document.createElement("div");


  t.className =
    "toast " + type;


  t.textContent =
    message;


  document.body.appendChild(t);


  setTimeout(() => {

    if (t.isConnected)
      t.remove();

  }, 3200);

}

  const btn =

  if (btn) {

    btn.textContent =
      saved === "dark"
        ? "☀"
        : "☾";

  }

}


function toggleTheme() {

  const next =
    document.documentElement.dataset.theme === "dark"
      ? "light"
      : "dark";


  document.documentElement.dataset.theme =
    next;


  localStorage.setItem(
    "delta-theme",
    next
  );


  const btn =
    $("themeBtn");


  if (btn) {

    btn.textContent =

}

============================================================ */

async function boot() {

  themeInit();


  const {
    data,
    error
  } =
    await db.auth.getSession();


  if (error) {

    console.error(error);

    showAuth("login");

    return;

  }


  me =
    data.session?.user?.id || null;


  if (me) {

    await loadCurrentProfile();

  } else {

    showAuth("signup");

  }


  db.auth.onAuthStateChange(
    async (_event, session) => {

      me =
        session?.user?.id || null;


      if (!me) {

        profile = null;

        showAuth("login");

        return;

      }


      await loadCurrentProfile();

    }
  );

}


async function loadCurrentProfile() {

  if (!me)
    return;


  const {
    data,
    error
  } =
    await db
      .from("profiles")
      .select("*")
      .eq("id", me)
      .maybeSingle();


  if (error) {

    console.error(
      "Profile load error:",
      error
    );


    toast(
      error.message,
      "error"
    );


    showProfile(true);

    return;

  }


  profile =
    data || null;


  if (!profile) {

    showProfile(true);

    return;

  }


  if (
    !profile.full_name ||
    !profile.full_name.trim()
  ) {

    showProfile(true);

    return;

  }


  renderShell();

}

async function submitAuth(e) {

  e.preventDefault();


  const email =
    $("authEmail")
      ?.value
      .trim();


  const password =
    $("authPassword")
      ?.value;


  if (
    !email ||
    !password
  )
    return;


  try {

    if (authMode === "signup") {

      const fullName =
        $("authName")
          ?.value
          .trim();


      if (!fullName) {

        toast(
          "Enter your name.",
          "error"
        );

        return;

      }


      const {
        data,
        error
      } =
        await db.auth.signUp({

          email,

          password,

          options: {

            data: {

              full_name:
                fullName

            }

          }

        });


      if (error)
        throw error;


      if (data.session) {

        toast(
          "Welcome to Delta ✦",
          "success"
        );

      } else {

        toast(
          "Account created. Confirm your email if confirmation is enabled.",
          "success"
        );

      }

    } else {

      const {
        error
      } =
        await db.auth.signInWithPassword({

          email,

          password

        });


      if (error)
        throw error;


      toast(
        "Welcome back.",
        "success"
      );

    }

  } catch (err) {

    console.error(err);

    toast(
      err?.message ||
      "Authentication failed.",
      "error"
    );

  }

}

/* ============================================================
   STORAGE
============================================================ */

async function upload(file, bucket) {

  if (!file)
    return null;


  if (
    file.size >
    8 * 1024 * 1024
  ) {

    throw new Error(
      "Maximum image size is 8 MB."
    );

  }


  const ext =
    (
      file.name
        .split(".")
        .pop() ||
      "jpg"
    )
      .toLowerCase();


  const path =
    `${me}/${crypto.randomUUID()}.${ext}`;


  const {
    error
  } =
    await db.storage
      .from(bucket)
      .upload(
        path,
        file,
        {
          upsert: false,
          cacheControl: "3600"
        }
      );


  if (error)
    throw error;


  const {
    data
  } =
    db.storage
      .from(bucket)
      .getPublicUrl(path);


  return data.publicUrl;

}

async function saveProfile(e) {

  e.preventDefault();


  if (!requireLogin())
    return;


  const saveButton =
    e.submitter;


  const originalText =
    saveButton?.innerHTML ||
    "Save profile";


  try {

    if (saveButton) {

      saveButton.disabled = true;

      saveButton.innerHTML =
        "Saving...";

    }


    const fullName =
      $("fullName")
        ?.value
        .trim();


    if (!fullName) {

      toast(
        "Full name is required.",
        "error"
      );

      return;

    }


    const file =
      $("avatarInput")
        ?.files?.[0];


    let avatarUrl =
      profile?.avatar_url ||
      null;


    if (file) {

      avatarUrl =
        await upload(
          file,
          "avatars"
        );

    }


    const payload = {

      id: me,

      full_name:
        fullName,

      startup_name:
        $("startup")
          ?.value
          .trim() ||
        null,

      headline:
        $("headline")
          ?.value
          .trim() ||
        null,

      industry:
        $("industry")
          ?.value ||
        null,

      stage:
        $("stage")
          ?.value ||
        null,

      bio:
        $("bio")
          ?.value
          .trim() ||
        null,

      website_url:
        $("website")
          ?.value
          .trim() ||
        null,

      avatar_url:
        avatarUrl

    };


    /*
      IMPORTANT

      We use upsert on the authenticated user's
      own UUID.

      INSERT:
        creates the profile.

      UPDATE:
        updates the profile.

      There is no .single() on the upsert response.
      This avoids the "coerce empty JSON" problem.
    */

    const {
      error
    } =
      await db
        .from("profiles")
        .upsert(
          payload,
          {
            onConflict: "id",
            ignoreDuplicates: false
          }
        );


    if (error) {

      console.error(
        "Supabase profile upsert:",
        error
      );

      /*
        Make the actual RLS problem obvious.
      */

      if (
        error.code === "42501" ||
        /row-level security/i.test(
          error.message || ""
        )
      ) {

        throw new Error(
          "Supabase blocked this profile save with RLS. Run the profiles RLS SQL supplied below the code."
        );

      }

      throw error;

    }


    /*
      Fetch the saved profile separately.
    */

    const {
      data: savedProfile,
      error: fetchError
    } =
      await db
        .from("profiles")
        .select("*")
        .eq("id", me)
        .maybeSingle();


    if (fetchError)
      throw fetchError;


    if (!savedProfile) {

      throw new Error(
        "Profile was saved, but it could not be read back. Check the SELECT policy for profiles."
      );

    }


    profile =
      savedProfile;


    toast(
      "Profile saved ✦",
      "success"
    );


    renderShell();


  } catch (err) {

/* ============================================================
   TAB SWITCH
============================================================ */

function switchTab(t) {

  tab = t;


  if (
    realtimeChannel &&
    t !== "messages"
  ) {

    db.removeChannel(
      realtimeChannel
    );

    realtimeChannel = null;

  }


  const buttons =
    document.querySelectorAll(
      ".bottomNav button"
    );


  buttons.forEach(x =>
    x.classList.remove(
      "active",
      "feed",
      "discover",
      "messages",
      "groups",
      "me"
    )
  );


  const index = {

    feed: 0,
    discover: 1,
    messages: 2,
    groups: 3,
    me: 4

  }[t];


  if (buttons[index]) {

    buttons[index]
      .classList.add(
        "active",
        t
      );

  }


  if (t === "feed")
    loadFeed();


  if (t === "discover")
    loadDiscover();


  if (t === "messages")
    loadMessages();


  if (t === "groups")
    loadGroups();


  if (t === "me")
    loadMyProfile();

}

/* ============================================================

============================================================ */

function previewPostImage(e) {

  const file =
    e.target.files?.[0];


  if (!file)
    return;


  const url =
    URL.createObjectURL(file);


  $("postImagePreview").innerHTML = `

    <img
      class="postPreview"
      src="${url}"
      alt=""
    >

  `;

}


async function createPost() {

  if (!requireLogin())
    return;


  const content =
    $("postText")
      ?.value
      .trim();


  const file =
    $("postImage")
      ?.files?.[0];


  if (
    !content &&
    !file
  ) {

    toast(
      "Write something or add an image.",
      "error"
    );

    return;

  }


  try {

    let imageUrl = null;


    if (file) {

      imageUrl =
        await upload(
          file,
          "posts"
        );

    }


    const {
      error
    } =
      await db
        .from("posts")
        .insert({

          user_id: me,

          content:
            content ||
            null,

          image_url:
            imageUrl

        });


    if (error)
      throw error;


    toast(
      "Posted ✦",
      "success"
    );


    loadFeed();


  } catch (err) {

    console.error(err);

    toast(
      err.message,
      "error"
    );

  }

}

/* ============================================================
   DELETE POST
============================================================ */

async function deletePost(postId) {

  if (!requireLogin())
    return;


  if (
    !confirm(
      "Delete this post?\n\nThis cannot be undone."
    )
  )
    return;


  try {

    const {
      error
    } =
      await db
        .from("posts")
        .delete()
        .eq(
          "id",
          postId
        )
        .eq(
          "user_id",
          me
        );


    if (error)
      throw error;


    toast(
      "Post deleted.",
      "success"
    );


    loadFeed();


  } catch (err) {

    toast(
      err.message,
      "error"
    );

  }

}

async function toggleComments(postId) {

  const box =
    $("comments-" + postId);


  if (!box)
    return;


  const opening =
    box.classList.contains(
      "hidden"
    );


  box.classList.toggle(
    "hidden"
  );


  if (!opening)
    return;


  await loadComments(postId);

}


async function loadComments(postId) {

  const {
    data,
    error
  } =
    await db
      .from("comments")
      .select(`
        *,

      `)
      .eq(
        "post_id",
        postId
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );

    toast(

async function addComment(postId) {

  if (!requireLogin())
    return;


  const input =
    $("commentInput-" + postId);


  const content =
    input
      ?.value
      .trim();


  if (!content)
    return;


  const {
    error
  } =
    await db
      .from("comments")
      .insert({

        post_id:
          postId,

        user_id:
          me,

        content

  if (error) {

    toast(

      "error"

    return;

  input.value = "";


  await loadComments(

async function loadMessages() {

  $("view").innerHTML = `

    <section class="page">


      <div class="pageHead">

        <span class="eyebrow">
          PRIVATE SPACE
        </span>

        <h2>
          Messages
        </h2>

        <p>
          Talk directly with other founders.
        </p>

      </div>


      <div
        id="messagePeople"
        class="messagePeople"
      >

        <div class="loading">
          Loading conversations...
        </div>

      </div>


    </section>

  `;


  const {
    data,
    error
  } =
    await db
      .from("messages")
      .select(`
        *,
        sender:profiles!messages_sender_id_fkey(*),
        receiver:profiles!messages_receiver_id_fkey(*)
      `)
      .or(
        `sender_id.eq.${me},receiver_id.eq.${me}`
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    $("messagePeople").innerHTML = `

      <div class="empty card">
        ${esc(error.message)}
      </div>

    `;

    return;

  }


  const people =
    new Map();


  (data || [])
    .forEach(m => {

      const other =
        m.sender_id === me
          ? m.receiver
          : m.sender;


      if (
        other &&
        !people.has(other.id)
      ) {

        people.set(
          other.id,
          {
            profile: other,
            last: m
          }
        );

      }

    });


  $("messagePeople").innerHTML =

    people.size

      ? [...people.values()]

/* ============================================================
   START MESSAGE
============================================================ */

async function startMessage(id) {

  if (!requireLogin())
    return;


  if (id === me) {

    toast(
      "You cannot message yourself.",
      "error"
    );

    return;

  }


  const {
    data: p,
    error
  } =
    await db
      .from("profiles")
      .select("*")
      .eq(
        "id",
        id
      )
      .single();


  if (error) {

    toast(
      error.message,
      "error"
    );

    return;

  }


  activeFounder =
    p;


  activeConversation =
    id;


  renderChat(p);


  await loadChatMessages(id);

}


/* ============================================================
   CHAT
============================================================ */

function renderChat(p) {

  $("view").innerHTML = `

    <section class="chatPage">


      <header class="chatHeader">


        <button
          class="back"
          onclick="
            switchTab('messages')
          "
        >
          ←
        </button>


        ${avatar(
          p,
          "small"
        )}


        <div>

          <b>
            ${esc(
              p.full_name ||
              "Founder"
            )}
          </b>

          <span>
            ${esc(
              p.startup_name ||
              "Founder"
            )}
          </span>

        </div>


      </header>


      <div
        id="chatMessages"
        class="chatMessages"
      >

        <div class="loading">
          Loading messages...
        </div>

      </div>


      <div class="chatComposer">


        <input
          id="messageInput"
          placeholder="Write a message..."
          autocomplete="off"
          onkeydown="
            if(event.key === 'Enter'){
              event.preventDefault();
              sendMessage();
            }
          "
        >


        <button
          onclick="sendMessage()"
        >
          ↑
        </button>


      </div>


    </section>

  `;


  subscribeMessages();

}


async function loadChatMessages(
  otherId
) {

  const {
    data,
    error
  } =
    await db
      .from("messages")
      .select(`
        *,
        sender:profiles!messages_sender_id_fkey(*)
      `)
      .or(
        `and(sender_id.eq.${me},receiver_id.eq.${otherId}),and(sender_id.eq.${otherId},receiver_id.eq.${me})`
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(error);

    if ($("chatMessages")) {

      $("chatMessages").innerHTML = `

        <div class="empty">

          ${esc(error.message)}

        </div>

      `;

    }

    return;

  }


  if (!$("chatMessages"))
    return;


  $("chatMessages").innerHTML =

    (data || [])
      .map(m => `

        <div
          class="bubbleRow ${
            m.sender_id === me
              ? "mine"
              : ""
          }"
        >

          <div class="bubble">

            ${esc(m.content)}

            <small>
              ${ago(m.created_at)}
            </small>

          </div>

        </div>

      `)
      .join("")

    ||

    `

      <div class="chatEmpty">

        <div>
          ✦
        </div>

        <p>
          Start the conversation.
        </p>

      </div>

    `;


  const box =
    $("chatMessages");


  box.scrollTop =
    box.scrollHeight;

}


async function sendMessage() {

  if (!requireLogin())
    return;


  const input =
    $("messageInput");


  if (!input)
    return;


  const content =
    input.value.trim();


  if (
    !content ||
    !activeConversation
  )
    return;


  const {
    error
  } =
    await db
      .from("messages")
      .insert({

        sender_id:
          me,

        receiver_id:
          activeConversation,

        content

      });


  if (error) {

    toast(
      error.message,
      "error"
    );

    return;

  }


  input.value = "";


  await loadChatMessages(
    activeConversation
  );

}


/* ============================================================
   REALTIME DIRECT MESSAGES
============================================================ */

function subscribeMessages() {

  if (realtimeChannel) {

    db.removeChannel(
      realtimeChannel
    );

    realtimeChannel = null;

  }


  realtimeChannel =
    db
      .channel(
        "delta-direct-" +
        me
      )
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "messages"
        },
        payload => {

          if (
            !activeConversation
          )
            return;


          const m =
            payload.new;


          const relevant =

            (
              m.sender_id === me &&
              m.receiver_id === activeConversation
            )

            ||

            (
              m.sender_id === activeConversation &&
              m.receiver_id === me
            );


          if (relevant) {

            loadChatMessages(
              activeConversation
            );

          }

        }
      )
      .subscribe();

}

async function createGroup() {

  if (!requireLogin())
    return;


  const name =
    prompt(
      "Room name"
    );


  if (!name?.trim())
    return;


  const description =
    prompt(
      "What is this room about?"
    )
    ||
    "Founder community";


  const {
    error
  } =
    await db
      .from("groups")
      .insert({

        owner_id:
          me,

        name:
          name.trim(),

        description:
          description.trim(),

        icon:
          "✦"

      });


  if (error) {

    toast(
      error.message,
      "error"
    );

    return;

  }


  loadGroups();

}


async function openGroup(id) {

  if (!requireLogin())
    return;


  const {
    data: group,
    error
  } =
    await db
      .from("groups")
      .select("*")
      .eq(
        "id",
        id
      )
      .single();


  if (error) {

    toast(
      error.message,
      "error"
    );

    return;

  }


  const {
    data: membership
  } =
    await db
      .from("group_members")
      .select("*")
      .eq(
        "group_id",
        id
      )
      .eq(
        "user_id",
        me
      )
      .maybeSingle();


  if (!membership) {

    const {
      error: joinError
    } =
      await db
        .from("group_members")
        .insert({

          group_id:
            id,

          user_id:
            me

        });


    if (joinError) {

      toast(
        joinError.message,
        "error"
      );

      return;

    }

  }


  $("view").innerHTML = `

    <section class="chatPage">


      <header class="chatHeader">


        <button
          class="back"
          onclick="
            switchTab('groups')
          "
        >
          ←
        </button>


        <div class="groupIcon smallIcon">
          ${esc(
            group.icon ||
            "✦"
          )}
        </div>


        <div>

          <b>
            ${esc(group.name)}
          </b>

          <span>
            ${esc(
              group.description ||
              "Founder community"
            )}
          </span>

        </div>


      </header>


      <div
        id="groupChat"
        class="chatMessages"
      >

        <div class="loading">
          Loading...
        </div>

      </div>


      <div class="chatComposer">


        <input
          id="groupInput"
          placeholder="Message the room..."
          onkeydown="
            if(event.key === 'Enter'){
              event.preventDefault();
              sendGroupMessage('${id}');
            }
          "
        >


        <button
          onclick="
            sendGroupMessage('${id}')
          "
        >
          ↑
        </button>


      </div>


    </section>

  `;


  await loadGroupMessages(id);

  subscribeGroupMessages(id);

}


async function loadGroupMessages(id) {

  const {
    data,
    error
  } =
    await db
      .from("group_messages")
      .select(`
        *,
        profiles!group_messages_user_id_fkey(*)
      `)
      .eq(
        "group_id",
        id
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {

    toast(
      error.message,
      "error"
    );

    return;

  }


  const box =
    $("groupChat");


  if (!box)
    return;


  box.innerHTML =

    (data || [])
      .map(m => `

        <div
          class="bubbleRow ${
            m.user_id === me
              ? "mine"
              : ""
          }"
        >

          <div class="bubble">

            ${
              m.user_id !== me

                ? `
                  <small style="opacity:.75">
                    ${esc(
                      m.profiles?.full_name ||
                      "Founder"
                    )}
                  </small>
                `

                : ""
            }

            ${esc(m.content)}

            <small>
              ${ago(m.created_at)}
            </small>

          </div>

        </div>

      `)
      .join("")

    ||

    `

      <div class="chatEmpty">

        <div>
          ◇
        </div>

        <p>
          Start the room conversation.
        </p>

      </div>

    `;


  box.scrollTop =
    box.scrollHeight;

}


async function sendGroupMessage(id) {

  if (!requireLogin())
    return;


  const input =
    $("groupInput");


  const content =
    input
      ?.value
      .trim();


  if (!content)
    return;


  const {
    error
  } =
    await db
      .from("group_messages")
      .insert({

        group_id:
          id,

        user_id:
          me,

        content

      });


  if (error) {

    toast(
      error.message,
      "error"
    );

    return;

  }


  input.value = "";


  loadGroupMessages(id);

}


function subscribeGroupMessages(id) {

  if (groupRealtimeChannel) {

    db.removeChannel(
      groupRealtimeChannel
    );

    groupRealtimeChannel = null;

  }


  groupRealtimeChannel =

    db
      .channel(
        "delta-group-" +
        id
      )
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "group_messages",
          filter:
            `group_id=eq.${id}`
        },
        () => {

          loadGroupMessages(id);

        }
      )
      .subscribe();

}

/* ============================================================
   SIGN OUT
============================================================ */

async function signOut() {

  if (
    !confirm(
      "Sign out of Delta?"
    )
  )
    return;


  if (realtimeChannel) {

    await db.removeChannel(
      realtimeChannel
    );

    realtimeChannel = null;

  }


  if (groupRealtimeChannel) {

    await db.removeChannel(
      groupRealtimeChannel
    );

    groupRealtimeChannel = null;

  }


  await db.auth.signOut();


  me = null;

  profile = null;

  activeFounder = null;

  activeConversation = null;

  tab = "feed";


  showAuth("login");

}
