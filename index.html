const SUPABASE_KEY = "sb_publishable_OabgwonALx7wgEU5jySfFA_eR6R3w_B";

const { createClient } = supabase;

const industries = [

const stages = [

let tab = "feed";
let activeFounder = null;
let activeConversation = null;
let realtimeChannel = null;

/* -------------------- HELPERS -------------------- */

const $ = id => document.getElementById(id);

function esc(value=""){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function ago(date){
  const sec = Math.floor((Date.now() - new Date(date).getTime()) / 1000);
  if(sec < 60) return "now";
  if(sec < 3600) return Math.floor(sec/60)+"m";
  if(sec < 86400) return Math.floor(sec/3600)+"h";
  if(sec < 604800) return Math.floor(sec/86400)+"d";
  return new Date(date).toLocaleDateString();
}

function initials(name="Founder"){
  return name.split(" ").map(x=>x[0]).slice(0,2).join("").toUpperCase();
}

function avatar(p, size=""){
  if(p?.avatar_url){
    return `<img class="avatar ${size}" src="${esc(p.avatar_url)}" alt="">`;
  }
  return `<div class="avatar ${size} avatarText">${esc(initials(p?.full_name))}</div>`;
}

function toast(message,type=""){
  const old=document.querySelector(".toast");
  if(old) old.remove();

  const t=document.createElement("div");
  t.className="toast "+type;
  t.textContent=message;
  document.body.appendChild(t);

  setTimeout(()=>t.remove(),2600);
}

function themeInit(){
  const saved=localStorage.getItem("ract-theme") || "dark";
  document.documentElement.dataset.theme=saved;
  $("themeBtn").textContent=saved==="dark"?"☀":"☾";
}

function toggleTheme(){
  const next=document.documentElement.dataset.theme==="dark"?"light":"dark";
  document.documentElement.dataset.theme=next;
  localStorage.setItem("ract-theme",next);
  $("themeBtn").textContent=next==="dark"?"☀":"☾";
}

function industryOptions(selected=""){
  return industries.map(x =>
    `<option ${x===selected?"selected":""}>${x}</option>`
  ).join("");
}

function stageOptions(selected=""){
  return stages.map(x =>
    `<option ${x===selected?"selected":""}>${x}</option>`
  ).join("");
}

/* -------------------- START -------------------- */

}

function previewAvatar(e){
  const file=e.target.files[0];
  if(!file)return;

  const url=URL.createObjectURL(file);

  $("avatarPreview").innerHTML=
    `<img class="avatar huge" src="${url}" alt="">`;
}

async function upload(file,bucket){
  if(!file)return null;

  const ext=file.name.split(".").pop();
  const path=`${me}/${crypto.randomUUID()}.${ext}`;

  const {error}=await db.storage
    .from(bucket)
    .upload(path,file,{upsert:false});

  if(error) throw error;

  const {data}=db.storage
    .from(bucket)
    .getPublicUrl(path);

  return data.publicUrl;
}

async function saveProfile(e){
  e.preventDefault();

  try{
    const file=$("avatarInput").files[0];
    let avatarUrl=profile?.avatar_url || null;

    if(file){
      avatarUrl=await upload(file,"avatars");
    }

    const payload={
      full_name:$("fullName").value.trim(),
      startup_name:$("startup").value.trim(),
      headline:$("headline").value.trim(),
      industry:$("industry").value,
      stage:$("stage").value,
      bio:$("bio").value.trim(),
      website_url:$("website").value.trim(),
      avatar_url:avatarUrl
    };

    const {data,error}=await db
      .from("profiles")
      .update(payload)
      .eq("id",me)
      .select()
      .single();

    if(error)throw error;

    profile=data;
    renderShell();
    toast("Profile saved ✦","success");

  }catch(err){
    console.error(err);
    toast(err.message,"error");
  }
}

/* -------------------- SHELL -------------------- */

function renderShell(){
  $("app").innerHTML=`

      <header class="topbar">
        <div>
          <div class="logo">ract</div>
          <div class="topSub">founder network</div>
        </div>

        <button class="miniProfile" onclick="openMyProfile()">
          ${avatar(profile,"small")}
        </button>
      </header>

      <main id="view"></main>

      <nav class="bottomNav">
        <button class="${tab==="feed"?"active feed":""}" onclick="switchTab('feed')">
          <span>⌂</span><small>Feed</small>
        </button>

        <button class="${tab==="discover"?"active discover":""}" onclick="switchTab('discover')">
          <span>⌕</span><small>Discover</small>
        </button>

        <button class="${tab==="messages"?"active messages":""}" onclick="switchTab('messages')">
          <span>◌</span><small>Messages</small>
        </button>

        <button class="${tab==="groups"?"active groups":""}" onclick="switchTab('groups')">
          <span>◇</span><small>Groups</small>
        </button>

        <button class="${tab==="me"?"active me":""}" onclick="switchTab('me')">
          <span>◎</span><small>Profile</small>
        </button>
      </nav>

    </div>
  `;

  switchTab(tab);
}

function switchTab(t){
  tab=t;

  document.querySelectorAll(".bottomNav button")
    .forEach(x=>x.classList.remove("active"));

  const buttons=document.querySelectorAll(".bottomNav button");
  const index={feed:0,discover:1,messages:2,groups:3,me:4}[t];

  if(buttons[index]){
    buttons[index].classList.add("active");
    buttons[index].classList.add(t);
  }

  if(t==="feed") loadFeed();
  if(t==="discover") loadDiscover();
  if(t==="messages") loadMessages();
  if(t==="groups") loadGroups();
  if(t==="me") loadMyProfile();
}

  return `

        <div class="authorInfo">
          <b>${esc(p.full_name || "Founder")}
            ${p.verified?`<span class="verified">✓</span>`:""}
          </b>
          <span>
            ${esc(p.startup_name || p.headline || "Founder")}
            · ${ago(post.created_at)}
          </span>
        </div>

        ${p.id===me?`
          <button class="dots deletePostBtn"
            onclick="deletePost('${post.id}')"
            title="Delete post">
            🗑
          </button>
        `:`
          <button class="dots" onclick="openFounder('${p.id}')">•••</button>
        `}

      </div>

      ${post.content?`
        <div class="postText">${esc(post.content).replace(/\n/g,"<br>")}</div>
      `:""}

      ${post.image_url?`
        <img class="postImage" src="${esc(post.image_url)}" alt="">
      `:""}

      <div class="postActions">

        <button class="${liked?"liked":""}"
          onclick="toggleLike('${post.id}',${liked})">
          ${liked?"♥":"♡"}
          <span>${post.likes?.length||0}</span>
        </button>

        <button onclick="toggleComments('${post.id}')">
          ◌ <span>${post.comments?.length||0}</span>
        </button>

        <button onclick="openFounder('${p.id}')">
          ◎
        </button>

      </div>

      <div id="comments-${post.id}" class="comments hidden">
        <div class="commentsList" id="commentList-${post.id}"></div>

        <div class="commentComposer">
          <input id="commentInput-${post.id}" placeholder="Write a comment...">
          <button onclick="addComment('${post.id}')">→</button>

}

async function deletePost(postId){
  const confirmed=confirm("Delete this post?");

  if(!confirmed)return;

  try{
    const {error}=await db
      .from("posts")
      .delete()
      .eq("id",postId)
      .eq("user_id",me);

    if(error)throw error;

    toast("Post deleted","success");
    loadFeed();

  }catch(err){
    console.error(err);
    toast(err.message,"error");
  }
}

async function createPost(){
  const content=$("postText")?.value.trim();
  const file=$("postImage")?.files[0];

  if(!content && !file){
    toast("Write something or add an image.","error");
    return;
  }

  try{
    let imageUrl=null;

    if(file){
      imageUrl=await upload(file,"posts");
    }

    const {error}=await db.from("posts").insert({
      user_id:me,
      content:content||null,
      image_url:imageUrl
    });

    if(error)throw error;

    toast("Posted ✦","success");
    loadFeed();

  }catch(err){
    toast(err.message,"error");
  }
}

async function toggleLike(postId,liked){
  if(liked){
    await db.from("likes")
      .delete()
      .eq("post_id",postId)
      .eq("user_id",me);
  }else{
    await db.from("likes").insert({
      post_id:postId,
      user_id:me
    });
  }

  loadFeed();
}

async function toggleComments(postId){
  const box=$("comments-"+postId);

  if(!box)return;

  box.classList.toggle("hidden");

  if(!box.classList.contains("hidden")){
    const {data}=await db
      .from("comments")
      .select(`*,profiles!comments_user_id_fkey(*)`)
      .eq("post_id",postId)
      .order("created_at",{ascending:true});

    $("commentList-"+postId).innerHTML=
      (data||[]).map(c=>`
        <div class="comment">
          ${avatar(c.profiles,"xs")}
          <div>
            <b>${esc(c.profiles?.full_name||"Founder")}</b>
            <p>${esc(c.content)}</p>
            <small>${ago(c.created_at)}</small>
          </div>
        </div>
      `).join("") ||
      `<div class="noComments">Start the conversation.</div>`;
  }
}

async function addComment(postId){
  const input=$("commentInput-"+postId);
  const content=input.value.trim();

  if(!content)return;

  const {error}=await db.from("comments").insert({
    post_id:postId,
    user_id:me,
    content
  });

  if(error){
    toast(error.message,"error");
    return;
  }

  input.value="";
  toggleComments(postId);
  setTimeout(()=>toggleComments(postId),50);
}

async function loadDiscover(){

  const {data,error}=await db

  if(error){
    $("founderList").innerHTML=`<div class="empty card">${esc(error.message)}</div>`;
    return;

  window.ractFounders=data||[];

async function renderFounders(list){
  const {data:follows}=await db
    .from("follows")
    .select("following_id")
    .eq("follower_id",me);

  const following=new Set((follows||[]).map(x=>x.following_id));

  $("founderList").innerHTML=list.length
    ? list.map(p=>`
      <article class="founderCard card">

        <div class="founderTop">
          ${avatar(p,"medium")}
          <button class="connectBtn ${following.has(p.id)?"following":""}"
            onclick="toggleFollow('${p.id}',${following.has(p.id)})">
            ${following.has(p.id)?"Following":"Connect"}
          </button>
        </div>

        <h3>${esc(p.full_name)}</h3>

        <div class="founderStartup">
          ${esc(p.startup_name||"Independent founder")}
        </div>

        <p>${esc(p.headline||p.bio||"Building the next thing.")}</p>

        <div class="tags">
          ${p.industry?`<span>${esc(p.industry)}</span>`:""}
          ${p.stage?`<span>${esc(p.stage)}</span>`:""}

    : `<div class="empty card">No founders found.</div>`;

function filterFounders(){
  const q=$("founderSearch").value.toLowerCase().trim();

  const list=(window.ractFounders||[]).filter(p =>
    [
      p.full_name,p.startup_name,p.headline,
      p.bio,p.industry,p.stage
    ].join(" ").toLowerCase().includes(q)
  );

  renderFounders(list);
}

async function toggleFollow(id,isFollowing){
  if(isFollowing){
    await db.from("follows")
      .delete()
      .eq("follower_id",me)
      .eq("following_id",id);
  }else{
    await db.from("follows").insert({
      follower_id:me,
      following_id:id
    });
  }

  loadDiscover();
}

    .from("messages")
    .select(`
      *,
      sender:profiles!messages_sender_id_fkey(*),
      receiver:profiles!messages_receiver_id_fkey(*)
    `)
    .or(`sender_id.eq.${me},receiver_id.eq.${me}`)
    .order("created_at",{ascending:false});

  if(error){
    $("messagePeople").innerHTML=
      `<div class="empty card">${esc(error.message)}</div>`;
    return;
  }

  const people=new Map();

  (data||[]).forEach(m=>{
    const other=m.sender_id===me?m.receiver:m.sender;

    if(other && !people.has(other.id)){
      people.set(other.id,{profile:other,last:m});
    }
  });

  $("messagePeople").innerHTML=people.size
    ? [...people.values()].map(x=>`
      <button class="messagePerson card" onclick="startMessage('${x.profile.id}')">
        ${avatar(x.profile,"medium")}
        <div>
          <b>${esc(x.profile.full_name)}</b>
          <span>${esc(x.profile.startup_name||"Founder")}</span>
          <small>${esc(x.last.content)} · ${ago(x.last.created_at)}</small>
        </div>
        <strong>→</strong>
      </button>
    `).join("")
    : `
      <div class="empty card">
        <div class="emptyIcon">◌</div>
        <h3>No conversations yet.</h3>
        <p>Discover a founder and start the first conversation.</p>
        <button class="primary" onclick="switchTab('discover')">
          Discover founders →
        </button>
      </div>
    `;
}

async function startMessage(id){
  const {data:p,error}=await db
    .from("profiles")
    .select("*")
    .eq("id",id)
    .single();

  if(error){
    toast(error.message,"error");
    return;
  }

  activeFounder=p;
  activeConversation=id;

  renderChat(p);
  loadChatMessages(id);
}

function renderChat(p){
  $("view").innerHTML=`
    <section class="chatPage">

      <header class="chatHeader">
        <button class="back" onclick="switchTab('messages')">←</button>
        ${avatar(p,"small")}
        <div>
          <b>${esc(p.full_name)}</b>
          <span>${esc(p.startup_name||"Founder")}</span>
        </div>
      </header>

      <div id="chatMessages" class="chatMessages">
        <div class="loading">Loading messages...</div>
      </div>

      <div class="chatComposer">
        <input id="messageInput"
          placeholder="Write a message..."
          onkeydown="if(event.key==='Enter')sendMessage()">
        <button onclick="sendMessage()">↑</button>
      </div>

    </section>
  `;

  subscribeMessages();
}

async function loadChatMessages(otherId){
  const {data,error}=await db
    .from("messages")
    .select(`
      *,
      sender:profiles!messages_sender_id_fkey(*)
    `)
    .or(
      `and(sender_id.eq.${me},receiver_id.eq.${otherId}),and(sender_id.eq.${otherId},receiver_id.eq.${me})`
    )
    .order("created_at",{ascending:true});

  if(error){
    $("chatMessages").innerHTML=
      `<div class="empty">${esc(error.message)}</div>`;
    return;
  }

  $("chatMessages").innerHTML=(data||[]).map(m=>`
    <div class="bubbleRow ${m.sender_id===me?"mine":""}">
      <div class="bubble">
        ${esc(m.content)}
        <small>${ago(m.created_at)}</small>
      </div>
    </div>
  `).join("") || `
    <div class="chatEmpty">
      <div>✦</div>
      <p>Start the conversation.</p>
    </div>
  `;

  const box=$("chatMessages");
  box.scrollTop=box.scrollHeight;
}

async function sendMessage(){
  const input=$("messageInput");
  const content=input.value.trim();

  if(!content || !activeConversation)return;

  const {error}=await db.from("messages").insert({
    sender_id:me,
    receiver_id:activeConversation,
    content
  });

  if(error){
    toast(error.message,"error");
    return;
  }

  input.value="";
  loadChatMessages(activeConversation);
}

function subscribeMessages(){
  if(realtimeChannel){
    db.removeChannel(realtimeChannel);
  }

  realtimeChannel=db.channel("ract-direct-messages-"+me)
    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"messages"
      },
      payload=>{
        if(
          activeConversation &&
          (
            (payload.new.sender_id===me &&
             payload.new.receiver_id===activeConversation) ||
            (payload.new.sender_id===activeConversation &&
             payload.new.receiver_id===me)
          )
        ){
          loadChatMessages(activeConversation);
        }
      }
    )
    .subscribe();
}

/* -------------------- GROUPS -------------------- */

async function loadGroups(){
  $("view").innerHTML=`
    <section class="page">
      <div class="pageHead groupHead">
        <div>
          <span class="eyebrow">COMMUNITIES</span>
          <h2>Founder rooms.</h2>
          <p>Build conversations around industries and ideas.</p>
        </div>
        <button class="roundAdd" onclick="createGroup()">+</button>
      </div>

      <div class="groupGrid" id="groupList">
        <div class="loading">Loading groups...</div>
      </div>
    </section>
  `;

  /*
    Groups use local browser storage in this two-file MVP so the core
    database remains focused on founders/posts/direct messages.
  */
  const groups=JSON.parse(localStorage.getItem("ract-groups")||"[]");

  if(!groups.length){
    $("groupList").innerHTML=`
      <div class="empty card">
        <div class="emptyIcon">◇</div>
        <h3>Create your first founder room.</h3>
        <p>Start a community around an industry, idea or problem.</p>
        <button class="primary" onclick="createGroup()">Create room →</button>
      </div>
    `;
    return;
  }

  $("groupList").innerHTML=groups.map(g=>`
    <button class="groupCard card" onclick="openGroup('${g.id}')">
      <div class="groupIcon">${g.icon||"◇"}</div>
      <div>
        <h3>${esc(g.name)}</h3>
        <p>${esc(g.description||"Founder community")}</p>
      </div>
      <span>→</span>
    </button>
  `).join("");
}

function createGroup(){
  const name=prompt("Room name");
  if(!name?.trim())return;

  const description=prompt("What is this room about?")||"Founder community";

  const groups=JSON.parse(localStorage.getItem("ract-groups")||"[]");

  groups.push({
    id:crypto.randomUUID(),
    name:name.trim(),
    description,
    icon:"✦"
  });

  localStorage.setItem("ract-groups",JSON.stringify(groups));
  loadGroups();
}

function openGroup(id){
  const groups=JSON.parse(localStorage.getItem("ract-groups")||"[]");
  const group=groups.find(x=>x.id===id);

  if(!group)return;

  const key="ract-group-chat-"+id;
  const messages=JSON.parse(localStorage.getItem(key)||"[]");

  $("view").innerHTML=`
    <section class="chatPage">

      <header class="chatHeader">
        <button class="back" onclick="switchTab('groups')">←</button>
        <div class="groupIcon smallIcon">${group.icon}</div>
        <div>
          <b>${esc(group.name)}</b>
          <span>${esc(group.description)}</span>
        </div>
      </header>

      <div id="groupChat" class="chatMessages">
        ${messages.map(m=>`
          <div class="bubbleRow ${m.user===me?"mine":""}">
            <div class="bubble">
              ${esc(m.text)}
              <small>${ago(m.time)}</small>
            </div>
          </div>
        `).join("")}
      </div>

      <div class="chatComposer">
        <input id="groupInput"
          placeholder="Message the room..."
          onkeydown="if(event.key==='Enter')sendGroupMessage('${id}')">
        <button onclick="sendGroupMessage('${id}')">↑</button>
      </div>

    </section>
  `;

  setTimeout(()=>{
    const c=$("groupChat");
    c.scrollTop=c.scrollHeight;
  },50);
}

function sendGroupMessage(id){
  const input=$("groupInput");
  const text=input.value.trim();

  if(!text)return;

  const key="ract-group-chat-"+id;
  const messages=JSON.parse(localStorage.getItem(key)||"[]");

  messages.push({
    user:me,
    text,
    time:new Date().toISOString()
  });

  localStorage.setItem(key,JSON.stringify(messages));
  openGroup(id);
}

/* -------------------- MY PROFILE -------------------- */

async function loadMyProfile(){
  const {data:posts}=await db
    .from("posts")
    .select("id")
    .eq("user_id",me);

  const {data:followers}=await db
    .from("follows")
    .select("follower_id")
    .eq("following_id",me);

  const {data:following}=await db
    .from("follows")
    .select("following_id")
    .eq("follower_id",me);

  $("view").innerHTML=`
    <section class="page">

      <div class="profileCover"></div>

      <section class="myProfile card">

        <div class="myProfileTop">
          ${avatar(profile,"profileAvatar")}

          <button class="ghost" onclick="showEditProfile()">
            Edit
          </button>
        </div>

        <span class="eyebrow">FOUNDER</span>

        <h1>${esc(profile.full_name)}</h1>

        <p class="headline">
          ${esc(profile.headline||"Building something new.")}
        </p>

        <div class="startupLine">
          ${esc(profile.startup_name||"Independent founder")}
          ${profile.verified?`<span class="verified">✓</span>`:""}
        </div>

        <p class="profileBio">
          ${esc(profile.bio||"Add a bio to tell your story.")}
        </p>

        <div class="tags">
          ${profile.industry?`<span>${esc(profile.industry)}</span>`:""}
          ${profile.stage?`<span>${esc(profile.stage)}</span>`:""}
        </div>

        <div class="stats">
          <div><b>${posts?.length||0}</b><span>Posts</span></div>
          <div><b>${followers?.length||0}</b><span>Followers</span></div>
          <div><b>${following?.length||0}</b><span>Following</span></div>
        </div>

        ${profile.website_url?
          `<a class="website" href="${esc(profile.website_url)}" target="_blank">
            ↗ ${esc(profile.website_url)}
          </a>`:""}

      </section>

      <div class="profileActions">
        <button class="ghost full" onclick="signOut()">
          Leave Ract
        </button>
      </div>

    </section>
  `;
}

function openMyProfile(){
  switchTab("me");
}

function showEditProfile(){
  showProfile(false);

  setTimeout(()=>{
    $("fullName").value=profile.full_name||"";
    $("startup").value=profile.startup_name||"";
    $("headline").value=profile.headline||"";
    $("industry").value=profile.industry||"";
    $("stage").value=profile.stage||"";
    $("bio").value=profile.bio||"";
    $("website").value=profile.website_url||"";

    if(profile.avatar_url){
      $("avatarPreview").innerHTML=
        `<img class="avatar huge" src="${esc(profile.avatar_url)}">`;
    }
  },0);
}

async function signOut(){
  localStorage.removeItem("ract_founder_id");

  if(realtimeChannel){
    db.removeChannel(realtimeChannel);
    realtimeChannel=null;
  }

  me=null;
  profile=null;
  showWelcome();
}

/* -------------------- INIT -------------------- */

boot();

</script>
