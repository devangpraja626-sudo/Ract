<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://inhxlwsjlddhnpalbocl.supabase.co'
const SUPABASE_KEY = 'sb_publishable_OabgwonALx7wgEU5jySfFA_eR6R3w_B'
const THRESHOLD = 15 // keep in sync with the SQL
const INDUSTRIES = ['AI', 'SaaS', 'Fintech', 'Health', 'EdTech', 'E-commerce', 'Climate', 'Consumer', 'Other']
const STAGES = ['Idea', 'Building MVP', 'Launched', 'Growing', 'Scaling']

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
const app = document.getElementById('app')
const $ = (s, r = document) => r.querySelector(s)
let me = null, profile = null, tab = 'feed', chan = null, authMode = 'signin'

/* ---------- icons ---------- */
const ICONS = {
  bulb: '<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>',

  heart: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>',
  chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  star: '<polygon points="12 2 15.1 8.6 22 9.3 17 14 18.2 21 12 17.7 5.8 21 7 14 2 9.3 8.9 8.6 12 2"/>',
  image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  compass: '<circle cx="12" cy="12" r="10"/><polygon points="16.2 7.8 14.1 14.1 7.8 16.2 9.9 9.9 16.2 7.8"/>',
  user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  eye: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
  send: '<path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',
}
const icon = (n, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`
const CHECK = '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'

const FLOATERS = [
  { i: 'bulb',   c: '#FFB84D', x: 4,  y: 8,  s: 58, t: 7,   d: 0, r: -10 },
  { i: 'rocket', c: '#8B6CFF', x: 82, y: 10, s: 66, t: 8,   d: 2, r: 8 },
  { i: 'heart',  c: '#FF5DA8', x: 9,  y: 36, s: 46, t: 6,   d: 1, r: 12 },
  { i: 'chat',   c: '#2DE2C8', x: 84, y: 38, s: 54, t: 9,   d: 3, r: -8 },
  { i: 'star',   c: '#FF8A4C', x: 4,  y: 62, s: 44, t: 7.5, d: 4, r: 14 },
  { i: 'users',  c: '#4C8DFF', x: 80, y: 66, s: 60, t: 8.5, d: 1, r: -12 },
  { i: 'image',  c: '#C56BFF', x: 12, y: 86, s: 50, t: 6.5, d: 2, r: 6 },
  { i: 'link',   c: '#2DE2C8', x: 76, y: 88, s: 46, t: 7,   d: 5, r: -6 },
]
$('#float').innerHTML = FLOATERS.map((f) =>
  `<div class="fi" style="left:${f.x}%;top:${f.y}%;width:${f.s}px;height:${f.s}px;--c:${f.c};--t:${f.t}s;--d:-${f.d}s;--r:${f.r}deg">${icon(f.i, 24)}</div>`
).join('')

/* ---------- theme ---------- */
const themeBtn = $('#themebtn')
const paintTheme = () => { themeBtn.innerHTML = icon(document.documentElement.dataset.theme === 'dark' ? 'sun' : 'moon', 20) }
themeBtn.onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'
  document.documentElement.dataset.theme = next
  localStorage.setItem('ract-theme', next)
  paintTheme()
}
paintTheme()

/* ---------- helpers ---------- */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const ago = (d) => {
  const s = (Date.now() - new Date(d)) / 1000
  if (s < 60) return 'now'
  if (s < 3600) return Math.floor(s / 60) + 'm'
  if (s < 86400) return Math.floor(s / 3600) + 'h'
  return Math.floor(s / 86400) + 'd'
}
const avatar = (p, size = 40) => p?.avatar_url
  ? `<img class="avatar" src="${esc(p.avatar_url)}" width="${size}" height="${size}" alt="">`
  : `<div class="avatar ph" style="width:${size}px;height:${size}px">${esc((p?.full_name || '?')[0].toUpperCase())}</div>`
const nameHtml = (p) => `<span class="name">${esc(p?.full_name)}${p?.verified ? `<span class="badge" title="Verified founder">${CHECK}</span>` : ''}</span>`
const tagsHtml = (p) => (p?.industry || p?.stage)
  ? `<div class="tags">${p.industry ? `<span class="tag">${esc(p.industry)}</span>` : ''}${p.stage ? `<span class="tag alt">${esc(p.stage)}</span>` : ''}</div>` : ''
const tagline = 'From <span class="c1">connect</span> <span class="to">to</span> <span class="c2">create</span>'
const skeleton = '<div class="card skel"><i></i><i></i><i></i></div>'

function toast(msg) {
  const t = document.createElement('div')
  t.className = 'toast'
  t.textContent = msg
  document.body.appendChild(t)
  setTimeout(() => t.remove(), 3400)
}
async function upload(bucket, file) {
  const ext = file.name.split('.').pop()
  const path = `${me.id}/${Date.now()}.${ext}`
  const { error } = await db.storage.from(bucket).upload(path, file)
  if (error) throw error
  return db.storage.from(bucket).getPublicUrl(path).data.publicUrl
}

/* ---------- session ---------- */
async function boot() {
  const { data } = await db.auth.getSession()
  await onSession(data.session)
  db.auth.onAuthStateChange((_e, s) => {
    if (s?.user?.id !== me?.id) setTimeout(() => onSession(s), 0)
  })
}
async function onSession(s) {
  me = s?.user ?? null
  profile = null
  if (!me) return showAuth()
  const { data } = await db.from('profiles').select('*').eq('id', me.id).maybeSingle()
  profile = data
  profile ? showShell() : showProfileForm()
}

/* ---------- landing + email auth ---------- */
function showAuth() {
  document.body.dataset.tab = 'auth'
  app.innerHTML = `<div class="auth"><div class="hero">
    <h1 class="brand">ract</h1>
    <h2 class="tagline">${tagline}</h2>
    <p class="lede">The home for founders to share ideas, earn a verified badge and build together.</p>
    <div class="glass" id="authbox"></div>
    <div class="chips">
      <span class="chip" style="--c:#FFB84D">${icon('bulb', 16)}Share ideas</span>
      <span class="chip" style="--c:#FF5DA8">${icon('star', 16)}Get verified</span>
      <span class="chip" style="--c:#4C8DFF">${icon('users', 16)}Group chats</span>
    </div></div></div>`
  authForm()
}
function authForm(msg = '', kind = 'err', email = '') {
  const signin = authMode === 'signin'
  $('#authbox').innerHTML = `
    <div class="seg">
      <button type="button" data-m="signin" class="${signin ? 'on' : ''}">Sign in</button>
      <button type="button" data-m="signup" class="${signin ? '' : 'on'}">Create account</button>
    </div>
    <form id="af">
      <label class="lbl" for="em">Email</label>
      <div class="inp">${icon('mail', 18)}<input id="em" type="email" name="email" autocomplete="email" placeholder="you@startup.com" value="${esc(email)}" required></div>
      <label class="lbl" for="pw">Password</label>
      <div class="inp">${icon('lock', 18)}<input id="pw" type="password" name="password" minlength="6"
        autocomplete="${signin ? 'current-password' : 'new-password'}" placeholder="At least 6 characters" required>
        <button type="button" class="eye" id="eye" aria-label="Show or hide password">${icon('eye', 18)}</button></div>
      <p class="note ${kind}">${esc(msg)}</p>
      <button class="btn block">${signin ? 'Sign in' : 'Create account'}</button>
    </form>`
  document.querySelectorAll('.seg button').forEach((b) => (b.onclick = () => {
    authMode = b.dataset.m
    authForm('', 'err', $('#em').value)
  }))
  $('#eye').onclick = () => { const i = $('#pw'); i.type = i.type === 'password' ? 'text' : 'password' }
  $('#af').onsubmit = async (e) => {
    e.preventDefault()
    const email = e.target.email.value.trim()
    const password = e.target.password.value
    const btn = e.target.querySelector('.btn')
    btn.disabled = true; btn.textContent = 'Please wait…'
    if (signin) {
      const { error } = await db.auth.signInWithPassword({ email, password })
      if (error) authForm(error.message, 'err', email)
    } else {
      const { data, error } = await db.auth.signUp({ email, password })
      if (error) return authForm(error.message, 'err', email)
      if (!data.session) {
        authMode = 'signin'
        authForm('Account created. Confirm your email from the message we sent, then sign in.', 'ok', email)
      }
    }
  }
}

/* ---------- profile create / edit ---------- */
function showProfileForm(editing = false) {
  document.body.dataset.tab = 'me'
  const p = profile || {}
  const opts = (list, cur, ph) => `<option value="">${ph}</option>` +
    list.map((o) => `<option ${o === cur ? 'selected' : ''}>${esc(o)}</option>`).join('')
  app.innerHTML = `<div class="shell"><div class="top"><h1 class="logo">ract</h1><p class="sub">${tagline}</p></div>
    <h2 class="sect">${editing ? 'Edit profile' : 'Create your founder profile'}</h2>
    <form id="pf" class="card">
      <div class="row" style="margin-bottom:14px"><div id="pv">${avatar(p, 64)}</div>
        <input type="file" name="photo" accept="image/*"></div>
      <input class="field" name="full_name" placeholder="Your name" value="${esc(p.full_name)}" required>
      <input class="field" name="startup_name" placeholder="Startup name" value="${esc(p.startup_name)}">
      <input class="field" name="headline" placeholder="One-line headline" value="${esc(p.headline)}">
      <div class="row">
        <select class="field grow" name="industry">${opts(INDUSTRIES, p.industry, 'Industry')}</select>
        <select class="field grow" name="stage">${opts(STAGES, p.stage, 'Stage')}</select>
      </div>
      <textarea class="field" name="bio" placeholder="What are you building? (20+ characters counts toward verification)">${esc(p.bio)}</textarea>
      <p class="err" id="perr"></p>
      <div class="row"><button class="btn">Save profile</button>
        ${editing ? '<button type="button" class="btn ghost" id="cancel">Cancel</button>' : '<button type="button" class="btn ghost" id="out">Sign out</button>'}</div>
    </form></div>`
  const form = $('#pf')
  form.photo.onchange = () => {
    const f = form.photo.files[0]
    if (f) $('#pv').innerHTML = `<img class="avatar" width="64" height="64" src="${URL.createObjectURL(f)}" alt="">`
  }
  if (editing) $('#cancel').onclick = showShell
  else $('#out').onclick = () => db.auth.signOut()
  form.onsubmit = async (e) => {
    e.preventDefault()
    const btn = form.querySelector('.btn'); btn.disabled = true
    try {
      let avatar_url = p.avatar_url ?? null
      const file = form.photo.files[0]
      if (file) avatar_url = await upload('avatars', file)
      const row = {
        id: me.id,
        full_name: form.full_name.value.trim(),
        startup_name: form.startup_name.value.trim(),
        headline: form.headline.value.trim(),
        industry: form.industry.value || null,
        stage: form.stage.value || null,
        bio: form.bio.value.trim(),
        avatar_url,
      }
      const { data, error } = await db.from('profiles').upsert(row).select().single()
      if (error) throw error
      profile = data
      showShell()
    } catch (err) {
      $('#perr').textContent = err.message
      btn.disabled = false
    }
  }
}

/* ---------- shell + tabs ---------- */
function showShell() {
  const tabs = [
    ['feed', 'Feed', 'home', '#7C5CFF'],
    ['discover', 'Discover', 'compass', '#0E9F92'],
    ['groups', 'Groups', 'users', '#F2691D'],
    ['me', 'Profile', 'user', '#F0457F'],
  ]
  app.innerHTML = `<div class="shell"><div class="top"><h1 class="logo">ract</h1><p class="sub">${tagline}</p></div><main id="main"></main></div>
    <nav class="tabs">${tabs.map(([k, l, ic, c]) =>
      `<button class="tab" data-tab="${k}" style="--c:${c}">${icon(ic, 20)}<span>${l}</span></button>`).join('')}</nav>`
  document.querySelectorAll('.tab').forEach((b) => (b.onclick = () => go(b.dataset.tab)))
  go(tab)
}
function go(t) {
  tab = t
  document.body.dataset.tab = t
  if (chan) { db.removeChannel(chan); chan = null }
  document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.dataset.tab === t))
  const views = { feed: viewFeed, discover: viewDiscover, groups: viewGroups, me: viewMe }
  views[t]()
}

/* ---------- feed ---------- */
async function viewFeed() {
  $('#main').innerHTML = `<form id="cf" class="card">
    <textarea class="field" name="content" placeholder="What are you building today?"></textarea>
    <div id="cprev"></div><p class="err" id="cerr"></p>
    <div class="row"><input type="file" name="image" accept="image/*" class="grow"><button class="btn">Post</button></div>
    </form><div id="posts">${skeleton}${skeleton}</div>`
  const cf = $('#cf')
  cf.image.onchange = () => {
    const f = cf.image.files[0]
    $('#cprev').innerHTML = f ? `<img class="post-img" src="${URL.createObjectURL(f)}" alt="">` : ''
  }
  cf.onsubmit = async (e) => {
    e.preventDefault()
    const content = cf.content.value.trim()
    const file = cf.image.files[0]
    if (!content && !file) return
    const btn = cf.querySelector('.btn'); btn.disabled = true
    try {
      const image_url = file ? await upload('posts', file) : null
      const { error } = await db.from('posts').insert({ user_id: me.id, content, image_url })
      if (error) throw error
      toast('Posted')
      viewFeed()
    } catch (err) {
      $('#cerr').textContent = err.message
      btn.disabled = false
    }
  }
  $('#posts').onclick = onPostClick
  loadPosts()
}

async function loadPosts() {
  const { data, error } = await db.from('posts')
    .select('*, profiles(id, full_name, startup_name, avatar_url, verified, stage), likes(user_id), comments(count)')
    .order('created_at', { ascending: false }).limit(50)
  const box = $('#posts')
  if (!box) return
  if (error) return (box.innerHTML = `<p class="err">${esc(error.message)}</p>`)
  if (!data.length) return (box.innerHTML = '<p class="empty">No posts yet. Share the first idea.</p>')
  box.innerHTML = data.map(postHtml).join('')
}

function postHtml(p) {
  const n = p.likes.length
  const liked = p.likes.some((l) => l.user_id === me.id)
  return `<article class="card post" data-id="${p.id}">
    <div class="row">${avatar(p.profiles)}
      <div class="grow">${nameHtml(p.profiles)}
        <div class="muted">${esc(p.profiles?.startup_name || 'Founder')} &nbsp;·&nbsp; ${ago(p.created_at)}</div></div>
      ${p.profiles?.stage ? `<span class="tag alt">${esc(p.profiles.stage)}</span>` : ''}</div>
    ${p.content ? `<p style="white-space:pre-wrap">${esc(p.content)}</p>` : ''}
    ${p.image_url ? `<img class="post-img" src="${esc(p.image_url)}" alt="">` : ''}
    <div class="actions">
      <button class="act ${liked ? 'on' : ''}" data-act="like" data-n="${n}" aria-label="Like">${icon('heart', 20)}<span>${n}</span></button>
      <button class="act" data-act="comments" aria-label="Comments">${icon('chat', 20)}<span>${p.comments[0]?.count ?? 0}</span></button>
    </div><div class="cbox"></div></article>`
}

async function onPostClick(e) {
  const btn = e.target.closest('[data-act]')
  if (!btn) return
  const card = btn.closest('.post')
  const id = card.dataset.id
  if (btn.dataset.act === 'like') {
    const liked = btn.classList.contains('on')
    const { error } = liked
      ? await db.from('likes').delete().match({ post_id: id, user_id: me.id })
      : await db.from('likes').insert({ post_id: id, user_id: me.id })
    if (error) return toast(error.message)
    const n = +btn.dataset.n + (liked ? -1 : 1)
    btn.dataset.n = n
    btn.classList.toggle('on')
    btn.querySelector('span').textContent = n
  } else {
    const box = $('.cbox', card)
    if (box.innerHTML) return (box.innerHTML = '')
    box.innerHTML = '<p class="muted">Loading…</p>'
    renderComments(card, id)
  }
}

async function renderComments(card, id) {
  const box = $('.cbox', card)
  const { data } = await db.from('comments')
    .select('*, profiles(full_name, avatar_url, verified)').eq('post_id', id).order('created_at')
  const list = data || []
  $('[data-act=comments] span', card).textContent = list.length
  box.innerHTML = list.map((c) => `<div class="row" style="align-items:flex-start;margin-top:12px">
      ${avatar(c.profiles, 30)}<div class="grow"><div>${nameHtml(c.profiles)} <span class="muted">${ago(c.created_at)}</span></div>
      <div>${esc(c.content)}</div></div></div>`).join('') +
    `<form class="row" style="margin-top:14px"><input class="field grow" name="c" placeholder="Add a comment" style="margin:0" required>
     <button class="btn small">Reply</button></form>`
  $('form', box).onsubmit = async (e) => {
    e.preventDefault()
    const content = e.target.c.value.trim()
    if (!content) return
    const { error } = await db.from('comments').insert({ post_id: id, user_id: me.id, content })
    if (error) return toast(error.message)
    renderComments(card, id)
  }
}

/* ---------- discover founders ---------- */
async function viewDiscover() {
  $('#main').innerHTML = `<input class="field" id="q" placeholder="Search founders, startups or industries"><div id="list">${skeleton}</div>`
  const [{ data: people }, { data: fl }] = await Promise.all([
    db.from('profiles').select('*').neq('id', me.id).order('score', { ascending: false }),
    db.from('follows').select('following_id').eq('follower_id', me.id),
  ])
  const following = new Set((fl || []).map((x) => x.following_id))
  const list = $('#list')
  if (!list) return
  const draw = () => {
    const q = $('#q').value.toLowerCase()
    const rows = (people || []).filter((p) =>
      [p.full_name, p.startup_name, p.industry, p.stage].join(' ').toLowerCase().includes(q))
    list.innerHTML = rows.length ? rows.map((p) => `<div class="card row">${avatar(p, 52)}
      <div class="grow">${nameHtml(p)}<div class="muted">${esc(p.startup_name || '')}</div>
        <div>${esc(p.headline || '')}</div>${tagsHtml(p)}</div>
      <button class="btn small ${following.has(p.id) ? 'ghost' : ''}" data-id="${p.id}">${following.has(p.id) ? 'Following' : 'Follow'}</button></div>`).join('')
      : '<p class="empty">No founders found yet. Invite someone to join Ract.</p>'
  }
  $('#q').oninput = draw
  draw()
  list.onclick = async (e) => {
    const b = e.target.closest('button[data-id]')
    if (!b) return
    const id = b.dataset.id
    if (following.has(id)) {
      await db.from('follows').delete().match({ follower_id: me.id, following_id: id })
      following.delete(id)
    } else {
      await db.from('follows').insert({ follower_id: me.id, following_id: id })
      following.add(id)
    }
    draw()
  }
}

/* ---------- groups + chat ---------- */
async function viewGroups() {
  $('#main').innerHTML = `<form id="gf" class="card row">
    <input class="field grow" name="gname" placeholder="New group, e.g. Fintech founders" style="margin:0" required>
    <button class="btn">Create</button></form><div id="glist">${skeleton}</div>`
  $('#gf').onsubmit = async (e) => {
    e.preventDefault()
    const name = e.target.gname.value.trim()
    if (!name) return
    const { data, error } = await db.from('groups').insert({ name, created_by: me.id }).select().single()
    if (error) return toast(error.message)
    await db.from('group_members').insert({ group_id: data.id, user_id: me.id })
    viewGroups()
  }
  const { data } = await db.from('groups').select('*, group_members(user_id)').order('created_at', { ascending: false })
  const gl = $('#glist')
  if (!gl) return
  if (!data?.length) return (gl.innerHTML = '<p class="empty">No groups yet. Create the first one.</p>')
  gl.innerHTML = data.map((g) => {
    const joined = g.group_members.some((x) => x.user_id === me.id)
    return `<div class="card row"><div class="grow"><div class="name">${esc(g.name)}</div>
      <div class="muted">${g.group_members.length} members</div></div>
      ${joined ? `<button class="btn small" data-open="${g.id}">Open</button>`
               : `<button class="btn small ghost" data-join="${g.id}">Join</button>`}</div>`
  }).join('')
  gl.onclick = async (e) => {
    const b = e.target.closest('button')
    if (!b) return
    if (b.dataset.join) {
      const { error } = await db.from('group_members').insert({ group_id: b.dataset.join, user_id: me.id })
      if (error) return toast(error.message)
      viewGroups()
    }
    if (b.dataset.open) openChat(data.find((g) => g.id === b.dataset.open))
  }
}

async function openChat(g) {
  $('#main').innerHTML = `<div class="row"><button class="btn ghost small" id="back">Back</button>
    <h2 style="font-size:1.4rem">${esc(g.name)}</h2></div><div class="chat" id="chat"></div>
    <form class="chatbar" id="cbar"><input class="field grow" name="text" placeholder="Message the group" autocomplete="off" required>
    <button class="btn" aria-label="Send">${icon('send', 18)}</button></form>`
  $('#back').onclick = () => go('groups')
  const load = async () => {
    const { data } = await db.from('messages').select('*, profiles(full_name)')
      .eq('group_id', g.id).order('created_at').limit(200)
    const box = $('#chat')
    if (!box) return
    box.innerHTML = (data || []).map((x) => `<div class="msg ${x.user_id === me.id ? 'me' : ''}">
      ${x.user_id === me.id ? '' : `<small>${esc(x.profiles?.full_name)}</small>`}${esc(x.content)}</div>`).join('')
      || '<p class="empty">No messages yet. Say hello.</p>'
    window.scrollTo(0, document.body.scrollHeight)
  }
  await load()
  chan = db.channel('group-' + g.id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `group_id=eq.${g.id}` }, load)
    .subscribe()
  $('#cbar').onsubmit = async (e) => {
    e.preventDefault()
    const text = e.target.text.value.trim()
    if (!text) return
    e.target.text.value = ''
    const { error } = await db.from('messages').insert({ group_id: g.id, user_id: me.id, content: text })
    if (error) toast(error.message)
  }
}

/* ---------- my profile ---------- */
async function viewMe() {
  const count = (t, col) => db.from(t).select('*', { count: 'exact', head: true }).eq(col, me.id)
  const [{ data }, po, fo, fi] = await Promise.all([
    db.from('profiles').select('*').eq('id', me.id).single(),
    count('posts', 'user_id'), count('follows', 'following_id'), count('follows', 'follower_id'),
  ])
  profile = data
  const pct = Math.min(100, Math.round((profile.score / THRESHOLD) * 100))
  $('#main').innerHTML = `<div class="card"><div class="cover"></div>
      <div class="who">${avatar(profile, 76)}
        <div class="grow" style="padding-bottom:4px">${nameHtml(profile)}<div class="muted">${esc(profile.startup_name || '')}</div></div></div>
      ${profile.headline ? `<p style="margin:6px 0"><strong>${esc(profile.headline)}</strong></p>` : ''}
      ${profile.bio ? `<p style="margin:6px 0">${esc(profile.bio)}</p>` : ''}
      ${tagsHtml(profile)}
      <div class="stats">
        <div class="stat"><b>${po.count ?? 0}</b><span class="muted">Posts</span></div>
        <div class="stat"><b>${fo.count ?? 0}</b><span class="muted">Followers</span></div>
        <div class="stat"><b>${fi.count ?? 0}</b><span class="muted">Following</span></div>
      </div></div>
    <div class="card"><strong>${profile.verified ? 'You are a verified founder' : 'Path to verification'}</strong>
      <div class="meter"><i style="width:${pct}%"></i></div>
      <p class="muted" style="margin:0">Score ${profile.score} of ${THRESHOLD}. A profile photo gives 3, a bio of 20+ characters gives 2,
      each post gives 2, each like received gives 1, and each follower gives 2.</p></div>
    <div class="row"><button class="btn" id="edit">Edit profile</button>
    <button class="btn ghost" id="out">Sign out</button></div>`
  $('#edit').onclick = () => showProfileForm(true)
  $('#out').onclick = () => db.auth.signOut()
}

boot()
</script>
</body>
